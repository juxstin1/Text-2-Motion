<!doctype html>
<html>
<head>
<!-- pack: bold-sports -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #111111; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #111111; color: #FFFFFF; }
  /* broadcast furniture: score bug top-left, ghost shirt number right */
  #bug { position: absolute; left: 80px; top: 64px; display: flex; height: 40px; font: 400 16px/40px 'Archivo Black'; letter-spacing: 0.2em; }
  #bug .s { background: rgba(255,255,255,0.08); padding: 0 16px; }
  #bug .t { background: #E8FF3A; color: #111111; padding: 0 14px; }
  #ghost { position: absolute; left: 760px; top: 40px; width: 460px; text-align: right; font: 400 520px/1 'Bebas Neue'; letter-spacing: 0.01em;
           color: rgba(255,255,255,0.05); }
  .slot { position: absolute; overflow: hidden; }
  .fill { width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; }
  #numSlot { left: 80px; top: 496px; width: 136px; height: 136px; }
  #numFill { background: #E8FF3A; color: #111111; display: flex; align-items: center; justify-content: center; }
  #numTxt { font: 400 120px/1 'Bebas Neue'; letter-spacing: 0.01em; padding-top: 10px; }
  #nameSlot { left: 216px; top: 496px; width: 460px; height: 84px; }
  #nameFill { background: #FFFFFF; color: #111111; padding: 0 32px; }
  #nameTxt { font: 400 56px/84px 'Bebas Neue'; letter-spacing: 0.01em; padding-top: 4px; }
  #subSlot { left: 216px; top: 580px; width: 460px; height: 52px; }
  #subFill { background: rgba(255,255,255,0.1); padding: 0 32px; }
  #subTxt { font: 400 16px/52px 'Archivo Black'; letter-spacing: 0.2em; color: #E8FF3A; }
</style>
</head>
<body>
<div id="stage">
  <div id="bug"><span class="s">NCF 2</span><span class="s" style="background:rgba(255,255,255,0.04)">1 RIV</span><span class="t">67'</span></div>
  <div id="ghost">10</div>
  <div class="slot" id="numSlot"><div class="fill" id="numFill"><div id="numTxt">10</div></div></div>
  <div class="slot" id="nameSlot"><div class="fill" id="nameFill"><div id="nameTxt">MARCUS REYES</div></div></div>
  <div class="slot" id="subSlot"><div class="fill" id="subFill"><div id="subTxt">FORWARD · NORTH CITY FC</div></div></div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  tl.from("#ghost", { x: 40, autoAlpha: 0, duration: 1.3, ease: "power2.out" }, 0)
    .from("#bug", { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 0)
    // each bar wipes out of its clip slot from the left, fast attack and long expo brake
    .from("#numFill", { xPercent: -101, duration: 0.6, ease: "expo.out" }, 0.1)
    .from("#numTxt", { yPercent: 100, duration: 0.5, ease: "power4.out" }, "<0.2")
    .from("#nameFill", { xPercent: -101, duration: 0.7, ease: "expo.out" }, 0.25)
    .from("#nameTxt", { x: -60, autoAlpha: 0, duration: 0.6, ease: "power3.out" }, "<0.12")
    .from("#subFill", { xPercent: -101, duration: 0.7, ease: "expo.out" }, "<0.1")
    .from("#subTxt", { x: -40, autoAlpha: 0, duration: 0.6, ease: "power3.out" }, "<0.12")
    .to({}, { duration: 0.5 }); // final hold
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
