<!doctype html>
<html>
<head>
<!-- pack: minimal-mono -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #F2F2F0; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #F2F2F0; color: #111111; font-family: 'JetBrains Mono'; }
  .meta { position: absolute; top: 64px; font: 500 12px/1 'JetBrains Mono'; letter-spacing: 0.1em; color: rgba(17,17,17,0.5); }
  #term { position: absolute; left: 160px; top: 195px; width: 960px; height: 330px; border-radius: 14px; background: #111111; color: #F2F2F0; }
  #bar { position: absolute; left: 0; top: 0; width: 960px; height: 52px; border-bottom: 1px solid rgba(242,242,240,0.1); }
  .dot { position: absolute; top: 20px; width: 12px; height: 12px; border-radius: 50%; background: rgba(242,242,240,0.18); }
  #title { position: absolute; left: 0; width: 960px; top: 20px; text-align: center; font: 500 12px/1 'JetBrains Mono'; letter-spacing: 0.1em; color: rgba(242,242,240,0.42); }
  #path { position: absolute; left: 56px; top: 104px; font: 400 18px/1 'JetBrains Mono'; color: rgba(242,242,240,0.45); }
  #cmd { position: absolute; left: 56px; top: 146px; white-space: pre; font: 700 48px/64px 'JetBrains Mono'; letter-spacing: -0.04em; }
  #cmd .p { color: #FF3B00; }
  #cursor { position: absolute; left: 0; top: 8px; width: 26px; height: 50px; background: #FF3B00; }
  .out { position: absolute; left: 56px; font: 400 18px/1 'JetBrains Mono'; color: rgba(242,242,240,0.6); }
  #o2 { color: #F2F2F0; }
  #o2 b { color: #FF3B00; font-weight: 700; }
</style>
</head>
<body>
<div id="stage">
  <div class="meta" style="left:160px">SESSION 01 / DEPLOY</div>
  <div class="meta" style="right:160px">ATLAS CLI v2.4</div>
  <div id="term">
    <div id="bar">
      <div class="dot" style="left:24px"></div>
      <div class="dot" style="left:44px"></div>
      <div class="dot" style="left:64px"></div>
      <div id="title">atlas — zsh — 96x24</div>
    </div>
    <div id="path">~/projects/atlas  main</div>
    <div id="cmd"><span class="p">$ </span><span id="typed">ship --prod --region eu</span><div id="cursor"></div></div>
    <div class="out" id="o1" style="top:238px">→ built 214 modules in 1.84s</div>
    <div class="out" id="o2" style="top:274px"><b>●</b> live at atlas.dev/eu</div>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/SplitText.min.js"></script>
<script>
gsap.registerPlugin(SplitText);
document.fonts.ready.then(() => {
  const split = SplitText.create("#typed", { type: "chars" });
  const chars = split.chars;
  const cursor = document.getElementById("cursor");
  const cmdBox = document.getElementById("cmd").getBoundingClientRect();
  // cursor x for "after char i" (measured once, before hiding)
  const startX = document.getElementById("typed").getBoundingClientRect().left - cmdBox.left;
  const afterX = chars.map(c => c.getBoundingClientRect().right - cmdBox.left + 2);

  const tl = gsap.timeline({ paused: true });
  tl.set(chars, { autoAlpha: 0 }, 0)
    .set(cursor, { x: startX }, 0)
    .from(["#term", ".meta"], { y: 24, autoAlpha: 0, duration: 0.7, ease: "power3.out", stagger: 0.06 }, 0);

  // idle blink before typing
  let t = 0.5;
  [0, 1].forEach(() => { tl.set(cursor, { autoAlpha: 0 }, t); tl.set(cursor, { autoAlpha: 1 }, t + 0.2); t += 0.4; });

  // human-ish rhythm from a fixed pattern: quick inside words, a beat at each word gap
  const rhythm = [0.045, 0.035, 0.055, 0.04];
  t += 0.08;
  chars.forEach((c, i) => {
    tl.set(c, { autoAlpha: 1 }, t).set(cursor, { x: afterX[i] }, t);
    t += rhythm[i % 4] + (chars[i + 1] && chars[i + 1].getBoundingClientRect().left - afterX[i] - cmdBox.left > 8 ? 0.1 : 0);
  });

  // a breath, then output answers back
  t += 0.14;
  tl.set(cursor, { autoAlpha: 0 }, t)
    .from("#o1", { x: -12, autoAlpha: 0, duration: 0.45, ease: "power2.out" }, t)
    .from("#o2", { x: -12, autoAlpha: 0, duration: 0.45, ease: "power2.out" }, t + 0.16)
    .set(cursor, { autoAlpha: 1 }, t + 0.36)
    .to({}, { duration: 0.6 }); // final hold
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
