<!doctype html>
<html>
<head>
<!-- pack: minimal-mono -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #F2F2F0; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #F2F2F0;
           font-family: 'JetBrains Mono', monospace; color: #111111; }
  #eyebrow { position: absolute; left: 200px; top: 104px; font-size: 12px; font-weight: 500;
             letter-spacing: 0.1em; text-transform: uppercase; color: rgba(17,17,17,0.5); }
  #title { position: absolute; left: 200px; top: 128px; font-size: 48px; font-weight: 700;
           letter-spacing: -0.04em; line-height: 1; }
  #count { position: absolute; right: 200px; top: 96px; font-size: 88px; font-weight: 700;
           letter-spacing: -0.04em; line-height: 1; color: #FF3B00; transform-origin: 100% 100%; }
  #rule { position: absolute; left: 200px; top: 214px; width: 880px; height: 2px; background: #111111;
          transform-origin: 0 50%; }
  #list { position: absolute; left: 200px; top: 232px; width: 880px; }
  .row { position: relative; height: 84px; border-bottom: 1px solid rgba(17,17,17,0.14); }
  .box { position: absolute; left: 0; top: 28px; width: 28px; height: 28px; box-sizing: border-box;
         border: 2px solid #111111; }
  .fill { position: absolute; left: 0; top: 0; width: 24px; height: 24px; background: #111111; }
  .check { position: absolute; left: -2px; top: -2px; width: 28px; height: 28px; overflow: visible; }
  .check path { fill: none; stroke: #F2F2F0; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
  .txt { position: absolute; left: 56px; top: 26px; font-size: 28px; font-weight: 400; line-height: 32px;
         white-space: nowrap; }
  .strike { position: absolute; left: -6px; top: 16px; height: 2px; background: #FF3B00; width: calc(100% + 12px);
            transform-origin: 0 50%; }
  .tag { position: absolute; right: 0; top: 34px; font-size: 12px; font-weight: 500; letter-spacing: 0.1em;
         text-transform: uppercase; color: rgba(17,17,17,0.45); }
  #status { position: absolute; left: 200px; top: 620px; font-size: 14px; font-weight: 500; letter-spacing: 0.1em;
            text-transform: uppercase; color: #FF3B00; }
</style>
</head>
<body>
<div id="stage">
  <div id="eyebrow">// sprint 14 &mdash; tuesday</div>
  <div id="title">release checklist</div>
  <div id="count">0/4</div>
  <div id="rule"></div>
  <div id="list">
    <div class="row"><div class="box"><div class="fill"><svg class="check" viewBox="0 0 28 28"><path d="M7 14.5 L12 19.5 L21.5 9"/></svg></div></div><div class="txt">run the test suite<div class="strike"></div></div><div class="tag">ci</div></div>
    <div class="row"><div class="box"><div class="fill"><svg class="check" viewBox="0 0 28 28"><path d="M7 14.5 L12 19.5 L21.5 9"/></svg></div></div><div class="txt">bump version to 2.4.0<div class="strike"></div></div><div class="tag">pkg</div></div>
    <div class="row"><div class="box"><div class="fill"><svg class="check" viewBox="0 0 28 28"><path d="M7 14.5 L12 19.5 L21.5 9"/></svg></div></div><div class="txt">update the changelog<div class="strike"></div></div><div class="tag">docs</div></div>
    <div class="row"><div class="box"><div class="fill"><svg class="check" viewBox="0 0 28 28"><path d="M7 14.5 L12 19.5 L21.5 9"/></svg></div></div><div class="txt">tag and push release<div class="strike"></div></div><div class="tag">git</div></div>
  </div>
  <div id="status">&rarr; ready to ship</div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/DrawSVGPlugin.min.js"></script>
<script>
gsap.registerPlugin(DrawSVGPlugin);
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  const rows = gsap.utils.toArray(".row");
  const countEl = document.getElementById("count");
  const counter = { n: 0 };
  const writeCount = () => { countEl.textContent = Math.round(counter.n) + "/4"; };

  gsap.set(".fill", { scale: 0 });
  gsap.set(".check path", { drawSVG: "0%" });
  gsap.set(".strike", { scaleX: 0 });

  tl.from(["#eyebrow", "#title"], { y: 18, autoAlpha: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 })
    .from("#count", { y: 18, autoAlpha: 0, duration: 0.6, ease: "power3.out" }, "<0.12")
    .from("#rule", { scaleX: 0, duration: 0.8, ease: "power3.inOut" }, 0.15)
    .from(rows, { x: -32, autoAlpha: 0, duration: 0.6, ease: "power3.out", stagger: 0.09 }, 0.35);

  rows.forEach((row, i) => {
    const t = 1.05 + i * 0.4;
    tl.to(row.querySelector(".fill"), { scale: 1, duration: 0.26, ease: "power3.out" }, t)
      .to(row.querySelector(".check path"), { drawSVG: "100%", duration: 0.3, ease: "power2.inOut" }, t + 0.1)
      .to(row.querySelector(".strike"), { scaleX: 1, duration: 0.36, ease: "power3.inOut" }, t + 0.16)
      .to(row.querySelector(".txt"), { autoAlpha: 0.4, duration: 0.36, ease: "power2.out" }, "<")
      .to(counter, { n: i + 1, duration: 0.2, ease: "power2.out", onUpdate: writeCount }, t + 0.12)
      .fromTo(countEl, { scale: 0.9 }, { scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t + 0.12);
  });

  tl.from("#status", { x: -16, autoAlpha: 0, duration: 0.5, ease: "power3.out" }, "-=0.1")
    .to({}, { duration: 0.6 });

  writeCount();
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
