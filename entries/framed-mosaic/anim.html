<!doctype html>
<html>
<head>
<!-- pack: gallery-serif -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #1C2B24; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #1C2B24; }
  .label { font-family: "Space Grotesk"; font-weight: 500; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
  #eyebrow { position: absolute; left: 80px; top: 100px; color: #E7B76A; }
  #title { position: absolute; left: 76px; top: 168px; margin: 0; font-family: "Instrument Serif"; font-weight: 400;
           font-size: 88px; line-height: 1.04; letter-spacing: -0.02em; color: #EAF0E6; }
  #rule { position: absolute; left: 80px; top: 386px; width: 64px; height: 1px; background: #E7B76A; transform-origin: 0 50%; }
  #body { position: absolute; left: 80px; top: 412px; width: 360px; margin: 0; font-family: "Space Grotesk"; font-size: 16px;
          line-height: 1.6; color: rgba(234,240,230,0.66); }
  #dates { position: absolute; left: 80px; top: 596px; color: rgba(234,240,230,0.5); }
  .tile { position: absolute; box-sizing: border-box; padding: 10px; background: rgba(234,240,230,0.05);
          border: 1px solid rgba(231,183,106,0.42); }
  .art { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div id="eyebrow" class="label">Room 04 &middot; Permanent Collection</div>
  <h1 id="title">Collected<br>Quiet Works</h1>
  <div id="rule"></div>
  <p id="body">Seven small paintings on loan from private homes, hung together for the first time.</p>
  <div id="dates" class="label">14 March &mdash; 30 June</div>

  <div class="tile" id="t1" style="left:560px; top:100px; width:200px; height:260px;">
    <div class="art"><svg viewBox="0 0 180 240" preserveAspectRatio="xMidYMid slice">
      <rect width="180" height="240" fill="#E7B76A" fill-opacity="0.18"/>
      <circle cx="90" cy="96" r="46" fill="#E7B76A" fill-opacity="0.85"/>
      <rect y="168" width="180" height="72" fill="#EAF0E6" fill-opacity="0.1"/>
    </svg></div>
  </div>
  <div class="tile" id="t2" style="left:776px; top:100px; width:200px; height:160px;">
    <div class="art"><svg viewBox="0 0 180 140" preserveAspectRatio="xMidYMid slice">
      <rect width="180" height="140" fill="#EAF0E6" fill-opacity="0.08"/>
      <rect x="0" y="0" width="60" height="140" fill="#EAF0E6" fill-opacity="0.16"/>
      <rect x="60" y="0" width="60" height="140" fill="#E7B76A" fill-opacity="0.3"/>
    </svg></div>
  </div>
  <div class="tile" id="t3" style="left:992px; top:100px; width:208px; height:220px;">
    <div class="art"><svg viewBox="0 0 188 200" preserveAspectRatio="xMidYMid slice">
      <rect width="188" height="200" fill="#1C2B24"/>
      <path d="M0 200 L94 70 L188 200 Z" fill="#EAF0E6" fill-opacity="0.2"/>
      <path d="M40 200 L120 104 L188 200 Z" fill="#E7B76A" fill-opacity="0.55"/>
    </svg></div>
  </div>
  <div class="tile" id="t4" style="left:776px; top:276px; width:200px; height:184px;">
    <div class="art"><svg viewBox="0 0 180 164" preserveAspectRatio="xMidYMid slice">
      <rect width="180" height="164" fill="#E7B76A" fill-opacity="0.12"/>
      <circle cx="0" cy="164" r="120" fill="none" stroke="#E7B76A" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="0" cy="164" r="84" fill="none" stroke="#EAF0E6" stroke-opacity="0.4" stroke-width="2"/>
      <circle cx="0" cy="164" r="48" fill="#EAF0E6" fill-opacity="0.25"/>
    </svg></div>
  </div>
  <div class="tile" id="t5" style="left:560px; top:376px; width:200px; height:244px;">
    <div class="art"><svg viewBox="0 0 180 224" preserveAspectRatio="xMidYMid slice">
      <rect width="180" height="224" fill="#EAF0E6" fill-opacity="0.12"/>
      <rect x="36" y="40" width="108" height="144" fill="#1C2B24"/>
      <rect x="62" y="74" width="56" height="76" fill="#E7B76A" fill-opacity="0.75"/>
    </svg></div>
  </div>
  <div class="tile" id="t6" style="left:992px; top:336px; width:208px; height:284px;">
    <div class="art"><svg viewBox="0 0 188 264" preserveAspectRatio="xMidYMid slice">
      <rect width="188" height="264" fill="#E7B76A" fill-opacity="0.22"/>
      <rect y="150" width="188" height="114" fill="#1C2B24" fill-opacity="0.7"/>
      <circle cx="132" cy="92" r="26" fill="#EAF0E6" fill-opacity="0.8"/>
      <path d="M0 150 C 50 130, 120 168, 188 142 L188 150 L0 150 Z" fill="#1C2B24" fill-opacity="0.7"/>
    </svg></div>
  </div>
  <div class="tile" id="t7" style="left:776px; top:476px; width:200px; height:144px;">
    <div class="art"><svg viewBox="0 0 180 124" preserveAspectRatio="xMidYMid slice">
      <rect width="180" height="124" fill="#EAF0E6" fill-opacity="0.06"/>
      <path d="M0 62 H180" stroke="#E7B76A" stroke-width="2"/>
      <circle cx="54" cy="62" r="14" fill="#EAF0E6" fill-opacity="0.6"/>
      <circle cx="126" cy="62" r="22" fill="#E7B76A" fill-opacity="0.6"/>
    </svg></div>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/SplitText.min.js"></script>
<script>
gsap.registerPlugin(SplitText);
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  // fixed "scattered" reveal order (no randomness, so every frame is reproducible)
  const order = ["#t4", "#t1", "#t6", "#t2", "#t7", "#t3", "#t5"];
  const tiles = order.map(s => document.querySelector(s));
  const arts = tiles.map(t => t.querySelector(".art svg"));
  const title = SplitText.create("#title", { type: "lines", mask: "lines" });

  tl.from(tiles, { autoAlpha: 0, scale: 0.88, duration: 0.9, ease: "power3.out", stagger: 0.11 })
    .from(arts, { scale: 1.18, duration: 1.3, ease: "power3.out", stagger: 0.11 }, "<")
    .from("#eyebrow", { autoAlpha: 0, y: 12, duration: 0.6, ease: "power2.out" }, 0.35)
    .from(title.lines, { yPercent: 105, duration: 1.0, ease: "power4.out", stagger: 0.12 }, "<0.1")
    .from("#rule", { scaleX: 0, duration: 0.7, ease: "power3.inOut" }, "-=0.55")
    .from(["#body", "#dates"], { autoAlpha: 0, y: 14, duration: 0.7, ease: "power2.out", stagger: 0.12 }, "-=0.45")
    .to({}, { duration: 0.6 });
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
