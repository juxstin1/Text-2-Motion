<!doctype html>
<html>
<head>
<!-- pack: soft-saas -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #EEF1FB; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #EEF1FB;
           font-family: 'Manrope', sans-serif; color: #1A1F36; }

  /* static app backdrop */
  #page { position: absolute; left: 96px; top: 112px; width: 680px; }
  #eyebrow { font-weight: 600; font-size: 13px; letter-spacing: 0.04em; color: #6C5CE7; }
  #heading { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 56px; letter-spacing: -0.025em; line-height: 1.05; margin-top: 12px; }
  #lede { font-weight: 500; font-size: 16px; line-height: 1.5; color: rgba(26,31,54,0.6); margin-top: 16px; width: 520px; }
  .row { display: flex; align-items: center; gap: 16px; height: 64px; margin-top: 12px; padding: 0 20px;
         border-radius: 14px; background: rgba(26,31,54,0.04); }
  #lede { margin-bottom: 40px; }
  .av { width: 32px; height: 32px; border-radius: 50%; background: rgba(108,92,231,0.18); flex: none; }
  .ln { height: 10px; border-radius: 5px; background: rgba(26,31,54,0.12); }

  /* toasts */
  .toast { position: absolute; left: 856px; top: 40px; width: 376px; height: 80px; box-sizing: border-box;
           padding: 0 20px; border-radius: 18px; background: #1A1F36; color: #EEF1FB;
           display: flex; align-items: center; gap: 16px; box-shadow: 0 18px 40px rgba(26,31,54,0.18); }
  .ic { width: 40px; height: 40px; border-radius: 12px; background: #6C5CE7; flex: none; display: grid; place-items: center; }
  .ic svg { width: 20px; height: 20px; }
  .tx { flex: 1; }
  .tt { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .ts { font-weight: 500; font-size: 13px; color: rgba(238,241,251,0.6); margin-top: 4px; }
  .tm { font-weight: 600; font-size: 13px; letter-spacing: 0.04em; color: rgba(238,241,251,0.4); align-self: flex-start; margin-top: 18px; }
</style>
</head>
<body>
<div id="stage">
  <div id="page">
    <div id="eyebrow">WORKSPACE &middot; NORTHWIND</div>
    <div id="heading">Team activity</div>
    <div id="lede">Everything your team shipped, reviewed and billed this week.</div>
    <div class="row"><div class="av"></div><div class="ln" style="width:180px"></div><div class="ln" style="width:96px;opacity:.6"></div></div>
    <div class="row"><div class="av"></div><div class="ln" style="width:240px"></div><div class="ln" style="width:64px;opacity:.6"></div></div>
    <div class="row"><div class="av"></div><div class="ln" style="width:150px"></div><div class="ln" style="width:120px;opacity:.6"></div></div>
    <div class="row"><div class="av"></div><div class="ln" style="width:210px"></div><div class="ln" style="width:80px;opacity:.6"></div></div>
  </div>

  <div class="toast" id="t1">
    <div class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="#EEF1FB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg></div>
    <div class="tx"><div class="tt">Deploy succeeded</div><div class="ts">api-gateway &middot; v2.14 to production</div></div>
    <div class="tm">2m</div>
  </div>
  <div class="toast" id="t2">
    <div class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="#EEF1FB" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5h12v7.5H9l-3.5 3v-3H4z"/></svg></div>
    <div class="tx"><div class="tt">New comment</div><div class="ts">Priya on &ldquo;Q4 roadmap&rdquo;</div></div>
    <div class="tm">1m</div>
  </div>
  <div class="toast" id="t3">
    <div class="ic"><svg viewBox="0 0 20 20" fill="none" stroke="#EEF1FB" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="14" height="10" rx="2"/><path d="M3 8.5h14"/></svg></div>
    <div class="tx"><div class="tt">Invoice paid</div><div class="ts">Northwind Ltd &middot; $1,240.00</div></div>
    <div class="tm">now</div>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  const PITCH = 92;                       // toast height 80 + 12 gap
  const enter = { y: -28, scale: 0.96, autoAlpha: 0 };
  const settle = { y: 0, scale: 1, autoAlpha: 1, duration: 0.6, ease: "back.out(1.5)" };
  const nudge = { duration: 0.5, ease: "power3.out" };

  // toast 1 drops in
  tl.fromTo("#t1", enter, settle, 0.1)
  // toast 2: toast 1 makes room first, the new one drops into the top slot
    .to("#t1", { y: PITCH, ...nudge }, 0.95)
    .fromTo("#t2", enter, settle, "<0.16")
  // toast 3: both older toasts shift down one slot, the oldest dims slightly
    .to("#t1", { y: PITCH * 2, autoAlpha: 0.85, ...nudge }, 1.8)
    .to("#t2", { y: PITCH, ...nudge }, "<")
    .fromTo("#t3", enter, settle, "<0.16")
    .to({}, { duration: 0.7 }); // final hold

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
