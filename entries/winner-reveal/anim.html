<!doctype html>
<html>
<head>
<!-- pack: playful -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #FFE8D6; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #FFE8D6; }
  /* pack background: hidden by render.py --alpha so the graphic sits on footage */
  #bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, #FFF1E6 0%, #FFE8D6 65%); }
  #shake { position: absolute; left: 16px; top: 16px; width: 1248px; height: 688px; }

  /* burst layer: one big svg clipped to the stage, centred on the winner's final spot (row centre) */
  #fx { position: absolute; inset: 0; overflow: hidden; }
  #rays { position: absolute; left: -376px; top: -620px; width: 2000px; height: 2000px; visibility: hidden; opacity: 0; }

  #titleRow { position: absolute; left: 0; top: 40px; width: 1248px; display: flex; justify-content: center; }
  #title { font-family: "Syne"; font-weight: 800; font-size: 44px; letter-spacing: -0.03em; color: #FFE8D6; background: #2B1B4A;
           padding: 10px 34px 14px; border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 0 #FF4F7B;
           max-width: 1040px; overflow: hidden; }

  #row { position: absolute; left: 0; top: 170px; width: 1248px; height: 420px; display: flex; justify-content: center; align-items: center; gap: 140px; }
  .contender { position: relative; }
  .card { position: relative; width: 340px; height: 380px; box-sizing: border-box; border-radius: 36px; background: #FFE8D6;
          border: 5px solid #2B1B4A; box-shadow: 0 10px 0 #2B1B4A;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .tile { width: 170px; height: 170px; border-radius: 40px; display: flex; align-items: center; justify-content: center;
          background: color-mix(in srgb, var(--c) 22%, #FFE8D6); }
  .slot { position: relative; width: 120px; height: 120px; color: var(--c); }
  .slot svg { display: block; width: 100%; height: 100%; }
  .name { font-family: "Syne"; font-weight: 800; font-size: 44px; line-height: 1.1; letter-spacing: -0.03em; color: #2B1B4A;
          max-width: 290px; max-height: 2.2em; overflow: hidden; text-align: center; }
  .chip { font-family: "Sora"; font-weight: 700; font-size: 18px; letter-spacing: 0.06em; color: #FFE8D6; background: var(--c);
          padding: 6px 16px; border-radius: 999px; white-space: nowrap; max-width: 270px; overflow: hidden; text-overflow: ellipsis; }
  .ribbon { position: absolute; left: 50%; bottom: -30px; margin-left: -110px; width: 220px; text-align: center;
            font-family: "Syne"; font-weight: 800; font-size: 26px; letter-spacing: 0.06em; color: #FFE8D6; background: #FF4F7B;
            padding: 8px 0 10px; border-radius: 16px; border: 4px solid #2B1B4A; visibility: hidden; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="shake">
    <div id="fx">
      <svg id="rays" viewBox="-1000 -1000 2000 2000">
        <defs>
          <radialGradient id="fadeA" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="460">
            <stop offset="0.45" stop-color="#FF4F7B" stop-opacity="0.95"/><stop offset="1" stop-color="#FF4F7B" stop-opacity="0"/></radialGradient>
          <radialGradient id="fadeB" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="460">
            <stop offset="0.45" style="stop-color: var(--w)" stop-opacity="0.95"/><stop offset="1" style="stop-color: var(--w)" stop-opacity="0"/></radialGradient>
        </defs>
        <g id="rayArt"></g>
        <!-- the confetti group spans the whole svg (invisible frame) so it scales about the burst centre -->
        <g id="confetti"><rect x="-1000" y="-1000" width="2000" height="2000" fill="none"/></g>
      </svg>
    </div>
    <div id="titleRow"><div id="title"></div></div>
    <div id="row">
      <div class="contender" id="contA">
        <div class="card" id="cardA">
          <div class="tile">
            <div class="slot" id="slotA">
              <!-- placeholder logo: Orbit (planet + ring); paste any SVG logo here -->
              <svg id="logoA" viewBox="0 0 100 100"><circle cx="50" cy="50" r="24" fill="currentColor"/><ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="currentColor" stroke-width="7" transform="rotate(-24 50 50)"/><circle cx="84" cy="30" r="7" fill="currentColor"/></svg>
            </div>
          </div>
          <div class="name" id="nameA"></div>
          <div class="chip" id="chipA"></div>
          <div class="ribbon" id="ribbonA"></div>
        </div>
      </div>
      <div class="contender" id="contB">
        <div class="card" id="cardB">
          <div class="tile">
            <div class="slot" id="slotB">
              <!-- placeholder logo: Kite (split diamond) -->
              <svg id="logoB" viewBox="0 0 100 100"><polygon points="50,4 86,42 50,96 14,42" fill="currentColor"/><polygon points="50,4 86,42 50,50" fill="#2B1B4A" fill-opacity="0.25"/><polygon points="14,42 50,50 50,96" fill="#2B1B4A" fill-opacity="0.12"/></svg>
            </div>
          </div>
          <div class="name" id="nameB"></div>
          <div class="chip" id="chipB"></div>
          <div class="ribbon" id="ribbonB"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
const DATA = {
  title: "Who wins?",
  winner: "b",           // "a" or "b"
  winnerLabel: "WINNER",
  a: { name: "Orbit", tag: "ORBIT ONE", color: "#7B5CFF" },
  b: { name: "Kite", tag: "KITE AIR 3", color: "#00A99D" },
};

// ---- fill the DOM from DATA
const $ = s => document.querySelector(s);
const A = { d: DATA.a, cont: "#contA", card: "#cardA", slot: "#slotA", ribbon: "#ribbonA", name: "#nameA", chip: "#chipA" };
const B = { d: DATA.b, cont: "#contB", card: "#cardB", slot: "#slotB", ribbon: "#ribbonB", name: "#nameB", chip: "#chipB" };
const win = DATA.winner === "a" ? A : B;
const lose = win === A ? B : A;
$("#title").textContent = DATA.title;
[A, B].forEach(r => {
  $(r.cont).style.setProperty("--c", r.d.color);
  $(r.name).textContent = r.d.name;
  $(r.chip).textContent = r.d.tag;
  $(r.ribbon).textContent = DATA.winnerLabel;
});

// burst art: 16 rays + 28 confetti bits, laid out by index (deterministic)
const NS = "http://www.w3.org/2000/svg";
for (let i = 0; i < 16; i++) {
  const a0 = (i / 16) * Math.PI * 2, a1 = a0 + Math.PI / 22;
  const p = document.createElementNS(NS, "polygon");
  p.setAttribute("points", `0,0 ${Math.cos(a0) * 460},${Math.sin(a0) * 460} ${Math.cos(a1) * 460},${Math.sin(a1) * 460}`);
  p.setAttribute("fill", i % 2 ? "url(#fadeA)" : "url(#fadeB)");
  $("#rayArt").appendChild(p);
}
$("#rays").style.setProperty("--w", win.d.color);   // winner colour for half the rays
const bits = ["#FF4F7B", "#2B1B4A", win.d.color, "#FFE8D6"];
for (let i = 0; i < 28; i++) {
  const ang = i * 2.39996, r = 330 + (i % 5) * 34;   // golden-angle spread
  const c = document.createElementNS(NS, i % 3 ? "rect" : "circle");
  const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
  if (i % 3) { c.setAttribute("x", x - 9); c.setAttribute("y", y - 16); c.setAttribute("width", 18); c.setAttribute("height", 32);
               c.setAttribute("rx", 4); c.setAttribute("transform", `rotate(${i * 37} ${x} ${y})`); }
  else { c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 12); }
  c.setAttribute("fill", bits[i % 4]);
  c.setAttribute("stroke", "#2B1B4A"); c.setAttribute("stroke-width", 3);
  $("#confetti").appendChild(c);
}

// shrink text until it fits its box (max-width, and max-height for names allowed to wrap to two lines)
function fit(el, minScale = 0.45) {
  const base = parseFloat(getComputedStyle(el).fontSize);
  const over = () => el.scrollWidth > el.clientWidth || el.scrollHeight > el.clientHeight + 1;
  for (let s = base; over() && s > base * minScale; s -= 1) el.style.fontSize = s + "px";
}

document.fonts.ready.then(() => {
  fit($("#nameA"));
  fit($("#nameB"));
  fit($("#title"));
  const tl = gsap.timeline({ paused: true });
  // distance from the winner's centre to the middle of the row
  const w = $(win.cont);
  const toCentre = 624 - (w.offsetLeft + w.offsetWidth / 2);

  // 1. title bounces down, cards pop up, logos spring in
  tl.from("#title", { y: -40, scale: 0.6, autoAlpha: 0, duration: 0.55, ease: "back.out(2.6)" }, 0)
    .from([A.card, B.card], { y: 60, scale: 0.7, autoAlpha: 0, duration: 0.55, ease: "back.out(2.2)", stagger: 0.1 }, 0.08)
    .from([A.slot, B.slot], { scale: 0, rotation: -30, duration: 0.5, ease: "back.out(3)", stagger: 0.1 }, 0.25);

  // 2. suspense: both contenders shake, harder and harder, out of phase
  const wobble = (el, dir, at) => tl.to(el, { keyframes: [
      { rotation: 3 * dir, y: -4, duration: 0.09 }, { rotation: -3 * dir, y: 0, duration: 0.09 },
      { rotation: 5 * dir, y: -8, duration: 0.08 }, { rotation: -5 * dir, y: 0, duration: 0.08 },
      { rotation: 7 * dir, y: -12, duration: 0.07 }, { rotation: -7 * dir, y: 0, duration: 0.07 },
      { rotation: 8 * dir, y: -14, duration: 0.06 }, { rotation: 0, y: 0, duration: 0.07 } ], ease: "power1.inOut" }, at);
  wobble(A.cont, 1, 0.62);
  wobble(B.cont, -1, 0.66);
  tl.to("#title", { scale: 1.08, duration: 0.3, ease: "power2.inOut" }, 0.7)
    .to("#title", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 1.0);

  // 3. the loser hops (anticipation) and drops away, tumbling and shrinking
  const drop = 1.3;
  tl.to(lose.cont, { y: -26, scale: 1.04, duration: 0.14, ease: "power2.out" }, drop)
    .to(lose.cont, { y: 170, rotation: win === A ? 24 : -24, scale: 0.55, duration: 0.42, ease: "power2.in" }, drop + 0.14)
    .to(lose.cont, { autoAlpha: 0, duration: 0.26, ease: "power2.in" }, drop + 0.24);

  // 4. the winner crouches, glides to centre and bursts up big
  const pop = drop + 0.76;
  tl.to(win.cont, { scaleY: 0.9, scaleX: 1.06, duration: 0.16, ease: "power2.out" }, drop + 0.2)
    .to(win.cont, { x: toCentre, duration: 0.42, ease: "power3.inOut" }, drop + 0.34)
    .to(win.cont, { scaleY: 1.24, scaleX: 1.1, duration: 0.1, ease: "power2.out" }, pop - 0.1)
    .to(win.cont, { scale: 1.15, duration: 0.5, ease: "elastic.out(1, 0.5)" }, pop)
    .fromTo("#rays", { scale: 0.75, rotation: -20, autoAlpha: 0, transformOrigin: "50% 50%" },
                     { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.5, ease: "expo.out" }, pop - 0.04)
    .fromTo("#confetti", { scale: 0.75, rotation: 10, transformOrigin: "50% 50%" },
                         { scale: 1.3, rotation: 40, duration: 0.9, ease: "power3.out" }, pop - 0.02)
    .to("#confetti", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, pop + 0.5)
    .fromTo(win.ribbon, { scale: 0.2, rotation: -14, autoAlpha: 0 }, { scale: 1, rotation: -4, autoAlpha: 1, duration: 0.45, ease: "back.out(3.5)" }, pop + 0.14)
    .to("#shake", { keyframes: [ { y: 7, duration: 0.05 }, { y: -4, duration: 0.05 }, { y: 2, duration: 0.05 }, { y: 0, duration: 0.07 } ], ease: "power2.out" }, pop)
    // 5. alive until near the end: rays keep turning, the winner bobs once, the ribbon nods
    .to("#rays", { rotation: 12, duration: 1.0, ease: "power1.inOut" }, pop + 0.5)
    .to(win.cont, { y: -10, duration: 0.35, ease: "power2.inOut" }, pop + 0.55)
    .to(win.cont, { y: 0, duration: 0.4, ease: "power2.inOut" }, pop + 0.9)
    .to(win.ribbon, { rotation: 3, duration: 0.28, ease: "power2.inOut" }, pop + 0.7)
    .to(win.ribbon, { rotation: -2, duration: 0.35, ease: "back.out(2)" }, pop + 0.98)
    .to({}, { duration: 0.3 }, pop + 1.5);

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
