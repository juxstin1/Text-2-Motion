<!doctype html>
<html>
<head>
<!-- pack: gallery-serif -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #1C2B24; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #1C2B24;
           font-family: 'Space Grotesk', sans-serif; color: #EAF0E6; }
  .label { font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
  /* scene one (static, the blob grows over it) */
  #s1label { position: absolute; left: 120px; top: 200px; color: #E7B76A; }
  #s1title { position: absolute; left: 112px; top: 226px; font-family: 'Instrument Serif', serif; font-size: 88px;
             line-height: 1; letter-spacing: -0.02em; }
  #s1hint { position: absolute; right: 320px; top: 552px; text-align: right; color: rgba(234,240,230,0.7); }
  #blobSvg { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  /* scene two, on gold */
  #s2 { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; color: #1C2B24; }
  #s2label { position: absolute; left: 120px; top: 222px; color: rgba(28,43,36,0.7); }
  #s2title { position: absolute; left: 112px; top: 248px; font-family: 'Instrument Serif', serif; font-size: 88px;
             line-height: 1; letter-spacing: -0.02em; }
  #s2title .ln { display: block; width: fit-content; }
  #s2meta { position: absolute; left: 120px; top: 452px; font-size: 16px; color: rgba(28,43,36,0.75); }
  #frame { position: absolute; left: 760px; top: 116px; width: 340px; height: 440px; box-sizing: border-box;
           padding: 18px; background: #1C2B24; }
  #frame svg { display: block; width: 304px; height: 404px; }
  #plaque { position: absolute; left: 760px; top: 580px; width: 340px; text-align: center; color: rgba(28,43,36,0.75); }
</style>
</head>
<body>
<div id="stage">
  <div id="s1label" class="label">Gallery Nine &middot; Room I</div>
  <div id="s1title">Step into<br>the next room.</div>
  <div id="s1hint" class="label">Enter room II</div>

  <svg id="blobSvg" viewBox="0 0 1280 720" aria-hidden="true">
    <rect id="cover" width="1280" height="720" fill="#E7B76A"/>
    <g transform="translate(1004 558)">
      <g id="blob" fill="#E7B76A">
        <path d="M0 -40 C24 -42 42 -22 40 2 C39 24 22 41 -2 40 C-26 39 -43 22 -40 -3 C-38 -25 -22 -38 0 -40 Z"/>
        <circle id="lobeA" cx="22" cy="-18" r="24"/>
        <circle id="lobeB" cx="-24" cy="14" r="20"/>
        <circle id="lobeC" cx="10" cy="24" r="18"/>
      </g>
    </g>
  </svg>

  <div id="s2">
    <div id="s2label" class="label">Room II &middot; New acquisition</div>
    <div id="s2title"><span class="ln">The Pear,</span><span class="ln">in Amber</span></div>
    <div id="s2meta">Oil on linen, 2026 &middot; 90 &times; 120 cm</div>
    <div id="frame">
      <svg viewBox="0 0 304 404" aria-hidden="true">
        <rect width="304" height="404" fill="#EAF0E6"/>
        <circle id="sun" cx="214" cy="104" r="46" fill="#E7B76A" fill-opacity="0.45"/>
        <rect x="0" y="300" width="304" height="104" fill="#1C2B24" fill-opacity="0.14"/>
        <line x1="0" y1="300" x2="304" y2="300" stroke="#1C2B24" stroke-opacity="0.5" stroke-width="2"/>
        <ellipse id="pearShadow" cx="146" cy="302" rx="58" ry="7" fill="#1C2B24" fill-opacity="0.22"/>
        <g id="pear">
          <path d="M146 300 C96 300 84 262 96 232 C106 206 124 196 128 168 C131 146 136 132 148 132 C162 132 166 148 168 168 C171 196 190 206 200 232 C212 262 196 300 146 300 Z" fill="#E7B76A"/>
          <path d="M120 270 C108 252 112 228 126 214" fill="none" stroke="#EAF0E6" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round"/>
          <path d="M148 134 C148 120 150 110 156 102" fill="none" stroke="#1C2B24" stroke-width="5" stroke-linecap="round"/>
          <g id="leaf"><path d="M154 108 C166 92 188 90 198 96 C188 110 168 114 154 108 Z" fill="#1C2B24"/></g>
        </g>
      </svg>
    </div>
    <div id="plaque" class="label">Hall east &middot; Wall 4</div>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
document.fonts.ready.then(() => {
  gsap.set(["#blob", "#lobeA", "#lobeB", "#lobeC"], { transformOrigin: "50% 50%" });
  gsap.set("#pear", { transformOrigin: "50% 100%" });
  gsap.set("#leaf", { transformOrigin: "0% 100%" });
  gsap.set("#cover", { autoAlpha: 0 });
  gsap.set("#pearShadow", { transformOrigin: "50% 50%" });

  const tl = gsap.timeline({ paused: true });
  // the seed pops in like a button, then breathes in (anticipation)
  tl.from("#blob", { scale: 0, duration: 0.42, ease: "back.out(2.4)" }, 0.05)
    .to("#blob", { scaleX: 0.84, scaleY: 0.74, rotation: -14, duration: 0.3, ease: "power2.inOut" }, 0.5)
    // grow: starts slow and accelerates, so the swell stays readable before it swallows the frame
    .to("#blob", { scaleX: 36, scaleY: 36, rotation: 110, duration: 0.95, ease: "power2.in" }, 0.8)
    // once the frame is fully gold, a flat rect takes over from the blob
    .set("#cover", { autoAlpha: 1 }, 1.75)
    .set("#blob", { autoAlpha: 0 }, 1.75)
    // lobes swell at different moments so the leading edge stays lumpy and alive
    .to("#lobeA", { scale: 1.5, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.8)
    .to("#lobeB", { scale: 1.6, x: -6, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.95)
    .to("#lobeC", { scale: 1.45, y: 6, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.88);

  // scene two: the artwork drops onto the wall with overshoot, then its contents land
  tl.from("#frame", { y: -70, scale: 0.6, rotation: -7, autoAlpha: 0, duration: 0.6, ease: "back.out(1.8)" }, 1.68)
    .to("#frame", { keyframes: [
        { rotation: 2.5, duration: 0.18, ease: "sine.inOut" },
        { rotation: -1, duration: 0.2, ease: "sine.inOut" },
        { rotation: 0, duration: 0.22, ease: "sine.out" } ] }, 2.24)
    .from("#s2label", { y: 14, autoAlpha: 0, duration: 0.45, ease: "power3.out" }, 1.76)
    .from("#s2title .ln", { y: 40, autoAlpha: 0, duration: 0.6, ease: "power4.out", stagger: 0.09 }, 1.82)
    .from("#s2meta", { y: 14, autoAlpha: 0, duration: 0.45, ease: "power3.out" }, 2.06)
    .from("#sun", { scale: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(2)" }, 2.01)
    // pear falls into the painting, squashes on the table line, the leaf lags and settles
    .from("#pear", { y: -300, duration: 0.36, ease: "power2.in" }, 2.04)
    .from("#pearShadow", { scaleX: 0.2, autoAlpha: 0, duration: 0.36, ease: "power2.in" }, 2.04)
    .to("#pear", { scaleY: 0.78, scaleX: 1.16, duration: 0.07, ease: "power2.out" }, 2.40)
    .to("#pear", { scaleY: 1, scaleX: 1, duration: 0.5, ease: "back.out(3)" }, 2.47)
    .fromTo("#leaf", { rotation: 0 }, { keyframes: [
        { rotation: 28, duration: 0.1, ease: "power2.out" },
        { rotation: -14, duration: 0.2, ease: "sine.inOut" },
        { rotation: 6, duration: 0.2, ease: "sine.inOut" },
        { rotation: 0, duration: 0.22, ease: "sine.out" } ] }, 2.40)
    .from("#plaque", { autoAlpha: 0, y: 10, duration: 0.45, ease: "power3.out" }, 2.46)
    .to({}, { duration: 0.25 });

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
