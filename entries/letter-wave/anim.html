<!doctype html>
<html>
<head>
<!-- pack: playful -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #FFE8D6; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #FFE8D6; }
  #eyebrow { position: absolute; left: 0; width: 1280px; top: 168px; text-align: center; font-family: "Sora"; font-weight: 700;
             font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase; color: #FF4F7B; }
  #word { position: absolute; left: 0; width: 1280px; top: 236px; margin: 0; text-align: center; font-family: "Syne"; font-weight: 800;
          font-size: 128px; line-height: 1.2; letter-spacing: -0.03em; color: #2B1B4A; }
  #word .char { transform-origin: 50% 100%; }
  #squiggle { position: absolute; left: 440px; top: 438px; width: 400px; height: 28px; overflow: visible; }
  #caption { position: absolute; left: 0; width: 1280px; top: 500px; margin: 0; text-align: center; font-family: "Sora";
             font-weight: 500; font-size: 18px; color: rgba(43,27,74,0.7); }
</style>
</head>
<body>
<div id="stage">
  <div id="eyebrow">Weekend plans</div>
  <h1 id="word">Splashy!</h1>
  <svg id="squiggle" viewBox="0 0 400 28"><path id="sq" d="M4 14 Q 29 0 54 14 T 104 14 T 154 14 T 204 14 T 254 14 T 304 14 T 354 14 T 396 14" fill="none" stroke="#FF4F7B" stroke-width="6" stroke-linecap="round"/></svg>
  <p id="caption">Pool party at ours, Saturday from two. Bring a towel.</p>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/SplitText.min.js"></script>
<script src="../../vendor/DrawSVGPlugin.min.js"></script>
<script>
gsap.registerPlugin(SplitText, DrawSVGPlugin);
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  const split = SplitText.create("#word", { type: "chars", charsClass: "char" });

  // each letter: pop up from below, crest, land with a squash, recover. The stagger makes it a wave.
  tl.fromTo(split.chars, { y: 44, autoAlpha: 0 }, {
      keyframes: [
        { y: -46, autoAlpha: 1, duration: 0.34, ease: "power2.out" },
        { y: 0, duration: 0.26, ease: "power2.in" },
        { scaleY: 0.84, scaleX: 1.05, duration: 0.07, ease: "power1.out" },
        { scaleY: 1, scaleX: 1, duration: 0.28, ease: "back.out(3)" }
      ],
      stagger: 0.065 }, 0.1)
    .from("#eyebrow", { autoAlpha: 0, y: -10, duration: 0.5, ease: "power3.out" }, 0)
    .fromTo("#sq", { drawSVG: "0%" }, { drawSVG: "100%", duration: 0.7, ease: "power2.inOut" }, "-=0.45")
    .from("#caption", { autoAlpha: 0, y: 12, duration: 0.5, ease: "power3.out" }, "-=0.4")
    .to({}, { duration: 0.5 });
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
