<!doctype html>
<html>
<head>
<!-- pack: bold-sports -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #111111; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #111111; }
  .scene { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  #sceneA { background: #111111; color: #FFFFFF; }
  #sceneB { background: #E8FF3A; color: #111111; }
  /* full-width masks so the big words can fly in from past the stage edge */
  .row { position: absolute; left: 0; top: 176px; width: 1280px; height: 190px; overflow: hidden; }
  .word { position: absolute; left: 96px; top: 0; font-family: "Bebas Neue"; font-weight: 400; font-size: 200px;
          line-height: 0.95; letter-spacing: 0.01em; white-space: nowrap; }
  .label { position: absolute; left: 100px; top: 140px; font-family: "Archivo Black"; font-size: 16px; letter-spacing: 0.2em; }
  #sceneA .label { color: #E8FF3A; }
  #sceneB .label { color: rgba(17,17,17,0.6); }
  .vs { position: absolute; left: 100px; top: 400px; font-family: "Archivo Black"; font-size: 32px; letter-spacing: 0.02em; }
  .when { position: absolute; left: 100px; top: 450px; font-family: "Archivo Black"; font-size: 22px; letter-spacing: 0.02em; }
  #sceneA .when { color: rgba(255,255,255,0.55); }
  #sceneB .when { color: rgba(17,17,17,0.6); }
  .bar { position: absolute; left: 100px; top: 520px; width: 176px; height: 10px; }
  #sceneA .bar { background: #E8FF3A; }
  #sceneB .bar { background: #111111; }
  .num { position: absolute; left: 880px; top: 420px; font-family: "Bebas Neue"; font-size: 200px; line-height: 0.95; }
  #sceneA .num { color: rgba(255,255,255,0.08); }
  #sceneB .num { color: rgba(17,17,17,0.1); }
  #wipe { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
</style>
</head>
<body>
<div id="stage">
  <!-- scene B sits underneath; scene A is hidden at the moment the stripes fully cover the frame -->
  <div class="scene" id="sceneB">
    <div class="num" id="numB">08</div>
    <div class="label" id="labB">MATCHDAY 08</div>
    <div class="row"><div class="word" id="away">AWAY</div></div>
    <div class="vs" id="vsB">AT RIVER UNITED</div>
    <div class="when" id="whenB">SUN 16:00 &middot; RIVERSIDE PARK</div>
    <div class="bar" id="barB"></div>
  </div>
  <div class="scene" id="sceneA">
    <div class="num" id="numA">07</div>
    <div class="label" id="labA">MATCHDAY 07</div>
    <div class="row"><div class="word" id="home">HOME</div></div>
    <div class="vs" id="vsA">VS NORTH CITY</div>
    <div class="when" id="whenA">SAT 19:00 &middot; NORTH STADIUM</div>
    <div class="bar" id="barA"></div>
  </div>
  <svg id="wipe" viewBox="0 0 1280 720">
    <polygon class="stripe" points="-241,0 1,0 -261,720 -503,720" fill="#FFFFFF"/>
    <polygon class="stripe" points="-1,0 241,0 -21,720 -263,720" fill="#111111"/>
    <polygon class="stripe" points="239,0 481,0 219,720 -23,720" fill="#E8FF3A"/>
    <polygon class="stripe" points="479,0 721,0 459,720 217,720" fill="#FFFFFF"/>
    <polygon class="stripe" points="719,0 961,0 699,720 457,720" fill="#111111"/>
    <polygon class="stripe" points="959,0 1201,0 939,720 697,720" fill="#E8FF3A"/>
    <polygon class="stripe" points="1199,0 1441,0 1179,720 937,720" fill="#FFFFFF"/>
    <polygon class="stripe" points="1439,0 1681,0 1419,720 1177,720" fill="#111111"/>
    <polygon class="stripe" points="1679,0 1921,0 1659,720 1417,720" fill="#E8FF3A"/>
  </svg>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  gsap.set(".stripe", { x: -2300 });

  // big word slams in sheared, overshoots its shear and snaps square (follow-through)
  const slam = (sel, at) =>
    tl.fromTo(sel, { x: -1100, skewX: 24 }, { x: 0, skewX: -7, duration: 0.36, ease: "power4.out" }, at)
      .to(sel, { skewX: 0, duration: 0.34, ease: "back.out(3)" }, at + 0.36);
  const info = (s, at) =>
    tl.from(`#lab${s}`, { autoAlpha: 0, y: 20, duration: 0.35, ease: "power3.out" }, at)
      .from([`#vs${s}`, `#when${s}`], { autoAlpha: 0, x: -40, duration: 0.4, ease: "power3.out", stagger: 0.07 }, at + 0.12)
      .from(`#bar${s}`, { scaleX: 0, transformOrigin: "0% 50%", duration: 0.4, ease: "back.out(2)" }, at + 0.25)
      .from(`#num${s}`, { autoAlpha: 0, x: 60, duration: 0.6, ease: "power3.out" }, at + 0.1);

  // SCENE A
  slam("#home", 0.05);
  info("A", 0.22);

  // anticipation: HOME flinches back against the incoming wipe
  tl.to("#home", { x: -22, skewX: 8, duration: 0.18, ease: "power2.out" }, 0.86);

  // STRIPES: fly in on a ragged diagonal (leading stripe first), lock over the frame, swap, fly out
  tl.to(".stripe", { x: 0, duration: 0.3, ease: "power3.out", stagger: { each: 0.02, from: "end" } }, 1.0)
    .to("#home", { x: 260, skewX: -18, duration: 0.25, ease: "power3.in" }, 1.0) // shoved by the leading edge
    .set("#sceneA", { autoAlpha: 0 }, 1.46)
    .to(".stripe", { x: 2300, duration: 0.32, ease: "power3.in", stagger: { each: 0.02, from: "end" } }, 1.48);

  // SCENE B rides in behind the trailing stripes
  slam("#away", 1.62);
  info("B", 1.78);
  // late accent: AWAY takes a small hop-and-settle once everything has landed
  tl.to("#away", { y: -14, scaleY: 1.05, scaleX: 0.97, transformOrigin: "50% 100%", duration: 0.12, ease: "power2.out" }, 2.42)
    .to("#away", { y: 0, scaleY: 0.95, scaleX: 1.04, duration: 0.1, ease: "power2.in" }, 2.54)
    .to("#away", { scaleY: 1, scaleX: 1, duration: 0.24, ease: "back.out(2.5)" }, 2.64)
    .to({}, { duration: 0.25 }); // final hold

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
