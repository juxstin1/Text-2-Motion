<!doctype html>
<html>
<head>
<!-- pack: gallery-serif -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #1C2B24; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #1C2B24; color: #EAF0E6; }
  .label { font: 500 13px/1 'Space Grotesk'; letter-spacing: 0.14em; text-transform: uppercase; }
  #kicker { position: absolute; left: 120px; top: 168px; color: #E7B76A; }
  #name { position: absolute; left: 112px; top: 196px; margin: 0; font: 400 160px/0.92 'Instrument Serif'; letter-spacing: -0.02em; }
  #name span { display: block; }
  #rule { position: absolute; left: 120px; top: 520px; width: 64px; height: 1px; background: #E7B76A; transform-origin: 0 50%; }
  #dates { position: absolute; left: 120px; top: 544px; font: 400 22px/1 'Space Grotesk'; letter-spacing: 0.14em; }
  #info { position: absolute; left: 880px; top: 168px; width: 280px; }
  #work { width: 280px; height: 300px; position: relative; border: 1px solid rgba(234,240,230,0.18); box-sizing: border-box; }
  #work svg { position: absolute; left: 20px; top: 20px; }
  #cap { margin-top: 20px; font: 400 16px/1.5 'Space Grotesk'; color: rgba(234,240,230,0.62); }
  #run { position: absolute; left: 880px; top: 544px; color: rgba(234,240,230,0.5); line-height: 22px; }
</style>
</head>
<body>
<div id="stage">
  <div class="label" id="kicker">Retrospective · Hall III</div>
  <h1 id="name"><span id="first">Ines</span><span id="last">Varadkar</span></h1>
  <div id="rule"></div>
  <div id="dates">1931 — 2019</div>
  <div id="info">
    <div id="work">
      <svg width="238" height="258" viewBox="0 0 238 258">
        <rect x="0" y="0" width="238" height="258" fill="rgba(234,240,230,0.04)"/>
        <circle cx="150" cy="96" r="58" fill="#E7B76A"/>
        <rect x="34" y="150" width="120" height="84" fill="rgba(234,240,230,0.14)"/>
        <line x1="34" y1="128" x2="204" y2="128" stroke="rgba(234,240,230,0.5)" stroke-width="1"/>
      </svg>
    </div>
    <div id="cap">Paintings, drawings and letters from six decades.</div>
  </div>
  <div class="label" id="run">12 Oct — 08 Mar</div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  // everything drifts up slowly on soft power2 curves; long overlapping durations keep it calm
  tl.from("#kicker", { y: 16, autoAlpha: 0, duration: 1.4, ease: "power2.out" }, 0)
    .from(["#first", "#last"], { y: 48, autoAlpha: 0, duration: 2.2, ease: "power2.out", stagger: 0.3 }, 0.25)
    .from("#work", { y: 36, autoAlpha: 0, duration: 2.0, ease: "power2.out" }, 0.6)
    .from("#rule", { scaleX: 0, duration: 1.2, ease: "power2.inOut" }, 1.1)
    .from(["#dates", "#cap", "#run"], { y: 20, autoAlpha: 0, duration: 1.5, ease: "power2.out", stagger: 0.15 }, 1.3)
    .to({}, { duration: 0.3 }); // final hold (power2 tails settle sub-pixel before this)
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
