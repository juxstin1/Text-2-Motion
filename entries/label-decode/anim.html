<!doctype html>
<html>
<head>
<!-- pack: minimal-mono -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #F2F2F0; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #F2F2F0; font-family: "JetBrains Mono"; color: #111111; }
  .label { font-weight: 500; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
  #frame { position: absolute; left: 96px; top: 96px; width: 1088px; height: 528px; box-sizing: border-box;
           border: 1px solid rgba(17,17,17,0.18); }
  #id { position: absolute; left: 32px; top: 28px; color: rgba(17,17,17,0.55); }
  #node { position: absolute; right: 32px; top: 28px; color: rgba(17,17,17,0.55); }
  #field { position: absolute; left: 32px; top: 172px; color: #FF3B00; }
  #word { position: absolute; left: 26px; top: 198px; margin: 0; font-weight: 700; font-size: 88px; line-height: 1.1;
          letter-spacing: -0.04em; white-space: pre; }
  #word .s { color: rgba(17,17,17,0.32); }
  #track { position: absolute; left: 32px; top: 336px; width: 1024px; height: 2px; background: rgba(17,17,17,0.1); }
  #bar { position: absolute; left: 0; top: 0; width: 1024px; height: 2px; background: #FF3B00; transform-origin: 0 50%; }
  #status { position: absolute; left: 32px; top: 356px; font-size: 14px; color: rgba(17,17,17,0.7); }
  #ok { position: absolute; right: 32px; top: 356px; font-size: 14px; font-weight: 700; color: #FF3B00; }
  #foot { position: absolute; left: 32px; top: 476px; color: rgba(17,17,17,0.45); }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
  <div id="id" class="label">SYS/04 &mdash; Sensor array</div>
  <div id="node" class="label">Node 7F &middot; Rev 2.1</div>
  <div id="field" class="label">&gt; Status</div>
  <h1 id="word">CALIBRATED</h1>
  <div id="track"><div id="bar"></div></div>
  <div id="status">decoding 000%</div>
  <div id="ok">[ OK ]</div>
  <div id="foot" class="label">Checksum 9A41 &middot; 12 channels verified</div>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  const FINAL = "CALIBRATED";
  const GLYPHS = "#%&*+<>/\\=?$@01ABXKZ7";
  const wordEl = document.getElementById("word");
  const statusEl = document.getElementById("status");

  // seeded hash: same (char index, step) always gives the same glyph, so any seek is reproducible
  const glyphAt = (i, step) => {
    let h = (i * 374761393 + step * 668265263) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
    return GLYPHS[((h ^ (h >>> 16)) >>> 0) % GLYPHS.length];
  };
  const esc = c => c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === "&" ? "&amp;" : c;
  const render = p => {
    const step = Math.floor(p * 36);           // glyphs change ~36 times over the decode
    let html = "";
    for (let i = 0; i < FINAL.length; i++) {
      const lockAt = 0.25 + 0.7 * (i / (FINAL.length - 1)); // left-to-right lock-in
      html += p >= lockAt ? FINAL[i] : '<span class="s">' + esc(glyphAt(i, step)) + "</span>";
    }
    wordEl.innerHTML = html;
    statusEl.textContent = "decoding " + String(Math.round(p * 100)).padStart(3, "0") + "%";
  };
  render(0);
  const decode = { p: 0 };

  tl.from("#frame", { autoAlpha: 0, scale: 0.98, duration: 0.6, ease: "power3.out" })
    .from(["#id", "#node", "#field"], { autoAlpha: 0, y: 8, duration: 0.4, ease: "power2.out", stagger: 0.06 }, "-=0.35")
    .from("#word", { autoAlpha: 0, duration: 0.25, ease: "power1.out" }, "-=0.2")
    .to(decode, { p: 1, duration: 1.6, ease: "power2.inOut", onUpdate: () => render(decode.p) }, "<")
    .from("#bar", { scaleX: 0, duration: 1.6, ease: "power2.inOut" }, "<")
    .from("#status", { autoAlpha: 0, duration: 0.3, ease: "power1.out" }, "<")
    .from("#ok", { autoAlpha: 0, x: -10, duration: 0.35, ease: "power3.out" }, "-=0.1")
    .from("#foot", { autoAlpha: 0, y: 8, duration: 0.4, ease: "power2.out" }, "<0.1")
    .to({}, { duration: 0.5 });
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
