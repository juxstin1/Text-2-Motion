<!doctype html>
<html>
<head>
<!-- pack: warm-modern -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #FBF3E4; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #FBF3E4; color: #3A2416; font-family: 'Inter'; }
  .label { font: 600 14px/1 'Inter'; letter-spacing: 0.1em; text-transform: uppercase; }
  #copy { position: absolute; left: 120px; top: 214px; width: 520px; }
  #kicker { color: #E0662E; }
  #headline { margin: 22px 0 0; font: 600 72px/1.02 'Fraunces'; letter-spacing: -0.03em; }
  #lede { margin: 26px 0 0; width: 400px; font: 400 17px/1.6 'Inter'; color: rgba(58,36,22,0.68); }
  #scene { position: absolute; left: 720px; top: 110px; width: 440px; height: 500px; perspective: 1400px; }
  #card { position: absolute; left: 0; top: 0; width: 440px; height: 500px; border-radius: 28px; overflow: hidden;
          background: #FBF3E4; border: 1px solid rgba(58,36,22,0.1); box-sizing: border-box;
          box-shadow: 0 50px 90px rgba(58,36,22,0.16), 0 8px 20px rgba(58,36,22,0.06); }
  #band { position: absolute; left: 0; top: 0; width: 440px; height: 132px;
          background: repeating-linear-gradient(135deg, rgba(224,102,46,0.16) 0 14px, rgba(224,102,46,0.10) 14px 28px); }
  #avatar { position: absolute; left: 40px; top: 76px; width: 112px; height: 112px; border-radius: 50%; background: #E0662E;
            border: 6px solid #FBF3E4; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
            font: 600 40px/1 'Fraunces'; letter-spacing: -0.03em; color: #FBF3E4; }
  #name { position: absolute; left: 40px; top: 214px; font: 600 40px/1 'Fraunces'; letter-spacing: -0.03em; }
  #role { position: absolute; left: 40px; top: 268px; color: #E0662E; }
  #bio { position: absolute; left: 40px; top: 302px; width: 360px; margin: 0; font: 400 17px/1.55 'Inter'; color: rgba(58,36,22,0.7); }
  #stats { position: absolute; left: 40px; top: 400px; width: 360px; display: flex; justify-content: space-between;
           border-top: 1px solid rgba(58,36,22,0.12); padding-top: 22px; }
  .stat b { display: block; font: 600 24px/1 'Fraunces'; letter-spacing: -0.03em; }
  .stat span { display: block; margin-top: 8px; font: 400 14px/1 'Inter'; color: rgba(58,36,22,0.6); }
</style>
</head>
<body>
<div id="stage">
  <div id="copy">
    <div class="label" id="kicker">The studio — 03</div>
    <h1 id="headline">People behind<br>the letters.</h1>
    <p id="lede">A small team drawing typefaces for books, brands and the occasional street sign.</p>
  </div>
  <div id="scene">
    <div id="card">
      <div id="band"></div>
      <div id="avatar">AM</div>
      <div id="name">Ada Marlowe</div>
      <div class="label" id="role">Lead type designer</div>
      <p id="bio">Twelve years of serifs, one stubborn obsession with the lowercase g.</p>
      <div id="stats">
        <div class="stat"><b>48</b><span>Typefaces</span></div>
        <div class="stat"><b>12 yrs</b><span>At the desk</span></div>
        <div class="stat"><b>Lisbon</b><span>Home base</span></div>
      </div>
    </div>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  tl.from(["#kicker", "#headline", "#lede"], { y: 30, autoAlpha: 0, duration: 0.8, ease: "power3.out", stagger: 0.1 })
    // card rises tipped back in 3D, then levels out on a long power4 tail
    .from("#card", { y: 80, rotationX: 28, rotationY: -14, transformOrigin: "50% 100%", duration: 1.3, ease: "power4.out" }, 0.2)
    .from("#card", { autoAlpha: 0, duration: 0.35, ease: "power1.out" }, 0.2)
    // avatar pops once the card is nearly flat, name and details follow
    .from("#avatar", { scale: 0.5, autoAlpha: 0, duration: 0.6, ease: "back.out(1.8)" }, 0.62)
    .from(["#name", "#role", "#bio", "#stats"], { y: 16, autoAlpha: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 }, "<0.12")
    .to({}, { duration: 0.6 }); // final hold
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
