<!doctype html>
<html>
<head>
<!-- pack: soft-saas -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #EEF1FB; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #EEF1FB; color: #1A1F36; }
  #fx { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  #title { position: absolute; left: 0; top: 452px; width: 1280px; margin: 0; text-align: center; font-family: "Sora";
           font-weight: 700; font-size: 56px; line-height: 1.1; letter-spacing: -0.025em; }
  #sub { position: absolute; left: 0; top: 530px; width: 1280px; margin: 0; text-align: center; font-family: "Manrope";
         font-weight: 500; font-size: 20px; color: rgba(26,31,54,0.6); }
  #tag { position: absolute; left: 0; top: 618px; width: 1280px; text-align: center; font-family: "Manrope"; font-weight: 600;
         font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: #6C5CE7; }
</style>
</head>
<body>
<div id="stage">
  <div id="tag">Transfer complete</div>
  <h1 id="title">Payment sent</h1>
  <p id="sub">$1,240.00 to Studio Nine &middot; just now</p>
  <!-- badge, shockwave and every sparkle share one SVG -->
  <svg id="fx" viewBox="0 0 1280 720">
    <ellipse id="shadow" cx="640" cy="388" rx="74" ry="10" fill="#1A1F36" fill-opacity="0.1"/>
    <circle id="halo" cx="640" cy="270" r="112" fill="#6C5CE7" fill-opacity="0.12"/>
    <circle id="wave" cx="640" cy="270" r="96" fill="none" stroke="#6C5CE7" stroke-width="4"/>
    <g id="sparks"></g>
    <g id="badge">
      <circle cx="640" cy="270" r="84" fill="#6C5CE7"/>
      <path id="check" d="M602 272 L630 300 L680 244" fill="none" stroke="#EEF1FB" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/DrawSVGPlugin.min.js"></script>
<script src="../../vendor/SplitText.min.js"></script>
<script>
gsap.registerPlugin(DrawSVGPlugin, SplitText);
document.fonts.ready.then(() => {
  const NS = "http://www.w3.org/2000/svg", CX = 640, CY = 270;
  const COLORS = ["#6C5CE7", "#1A1F36", "rgba(108,92,231,0.45)"];
  // fixed ring: [angle deg, distance, size, colour, spin, twinkle delay]; lower half kept short so it clears the title
  const SPARKS = [
    [-90, 196, 18, 0, 200, 0.00], [-62, 168, 11, 2, -160, 0.18], [-35, 214, 15, 1, 220, 0.08],
    [-8, 186, 20, 0, -200, 0.26], [18, 222, 10, 2, 180, 0.12], [40, 150, 14, 0, -220, 0.30],
    [68, 128, 9, 1, 160, 0.04], [112, 130, 12, 2, -180, 0.22], [140, 152, 15, 0, 200, 0.10],
    [162, 218, 11, 1, -160, 0.28], [188, 190, 19, 0, 220, 0.06], [215, 210, 10, 2, -200, 0.20],
    [242, 172, 16, 1, 180, 0.14], [-118, 222, 12, 0, -220, 0.24],
  ];
  const star = s => `M0 ${-s} Q0 0 ${s} 0 Q0 0 0 ${s} Q0 0 ${-s} 0 Q0 0 0 ${-s} Z`;
  const sparks = SPARKS.map(([a, d, s, c], i) => {
    const el = document.createElementNS(NS, i % 4 === 3 ? "circle" : "path");
    if (i % 4 === 3) { el.setAttribute("r", s * 0.4); } else { el.setAttribute("d", star(s)); }
    el.setAttribute("fill", COLORS[c]);
    el.setAttribute("class", "spark");
    document.getElementById("sparks").appendChild(el);
    return el;
  });
  const words = new SplitText("#title", { type: "words" }).words;

  const tl = gsap.timeline({ paused: true });
  gsap.set(sparks, { x: CX, y: CY, scale: 0, transformOrigin: "50% 50%" });
  gsap.set(["#wave", "#check"], { autoAlpha: 0 });

  // ANTICIPATION: a seed dot appears, then sucks in tighter before the pop
  tl.fromTo("#badge", { scale: 0, rotation: -14, transformOrigin: "50% 50%" },
                      { scale: 0.3, duration: 0.16, ease: "power2.out" }, 0.04)
    .to("#badge", { scale: 0.2, duration: 0.12, ease: "power2.in" }, 0.2)
    // POP with overshoot, then a volume-preserving wobble
    .to("#badge", { scale: 1.18, rotation: 4, duration: 0.2, ease: "expo.out" }, 0.32)
    .to("#badge", { scaleX: 1.1, scaleY: 0.9, rotation: 0, duration: 0.1, ease: "power2.inOut" }, 0.52)
    .to("#badge", { scaleX: 0.95, scaleY: 1.05, duration: 0.12, ease: "power2.inOut" }, 0.62)
    .to("#badge", { scaleX: 1, scaleY: 1, duration: 0.26, ease: "sine.out" }, 0.74)
    .from("#shadow", { scaleX: 0, autoAlpha: 0, transformOrigin: "50% 50%", duration: 0.4, ease: "expo.out" }, 0.32)
    .from("#halo", { scale: 0.4, autoAlpha: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(2)" }, 0.36)
    .fromTo("#wave", { scale: 0.8, autoAlpha: 1, transformOrigin: "50% 50%" },
                     { scale: 2, autoAlpha: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 0.34);

  // check draws on, badge gets a little punch when the stroke lands
  tl.set("#check", { autoAlpha: 1 }, 0.56)
    .fromTo("#check", { drawSVG: "0%" }, { drawSVG: "100%", duration: 0.32, ease: "power3.inOut", immediateRender: false }, 0.56)
    .to("#badge", { scale: 1.07, duration: 0.08, ease: "power2.out" }, 0.88)
    .to("#badge", { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.96);

  // SPARKLE RING: x and y on different eases so each flight curves; then each twinkles out on its own beat
  SPARKS.forEach(([a, d, s, c, spin, tw], i) => {
    const r = a * Math.PI / 180, dx = Math.cos(r) * d, dy = Math.sin(r) * d;
    const el = sparks[i], t0 = 0.34 + (i % 3) * 0.02;
    tl.to(el, { x: CX + dx, duration: 0.7, ease: "expo.out" }, t0)
      .to(el, { y: CY + dy, duration: 0.7, ease: "power3.out" }, t0)
      .to(el, { y: CY + dy + 14, duration: 0.9, ease: "sine.inOut" }, t0 + 0.7)  // slow drift down
      .to(el, { rotation: spin, duration: 1.2, ease: "power2.out" }, t0)
      .to(el, { scale: 1.2, duration: 0.18, ease: "back.out(3)" }, t0)
      .to(el, { scale: 0.45, duration: 0.16, ease: "sine.inOut" }, 0.78 + tw)
      .to(el, { scale: 1.1, duration: 0.14, ease: "sine.inOut" }, 0.94 + tw)
      .to(el, { scale: 0.5, duration: 0.14, ease: "sine.inOut" }, 1.08 + tw)
      .to(el, { scale: 0.9, duration: 0.14, ease: "sine.inOut" }, 1.22 + tw)
      .to(el, { scale: 0, autoAlpha: 0, duration: 0.28, ease: "power2.in" }, 1.5 + tw * 2);
  });

  // copy punches in under the badge
  tl.from("#tag", { autoAlpha: 0, y: 14, duration: 0.4, ease: "power3.out" }, 1.0)
    .from(words, { autoAlpha: 0, y: 40, scale: 0.6, rotation: 6, transformOrigin: "50% 100%",
                   duration: 0.45, ease: "back.out(1.4)", stagger: 0.08 }, 0.66)
    .from("#sub", { autoAlpha: 0, y: 16, duration: 0.45, ease: "power3.out" }, 0.86);

  // late accent: the halo breathes once more as the last sparkles die
  tl.to("#halo", { scale: 1.12, duration: 0.3, ease: "sine.inOut" }, 1.86)
    .to("#halo", { scale: 1, duration: 0.36, ease: "sine.inOut" }, 2.16)
    .to({}, { duration: 0.25 }); // final hold

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
