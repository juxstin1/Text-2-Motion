<!doctype html>
<html>
<head>
<!-- pack: tech-launch -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #0B0D12; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0B0D12; }
  /* pack background: hidden by render.py --alpha so the graphic sits on footage */
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, #161B26 0%, #0B0D12 70%); }
  /* shake wrapper is inset so a few px of shake never leaves the stage */
  #shake { position: absolute; left: 16px; top: 16px; width: 1248px; height: 688px; }

  /* title plate, centred, auto width */
  #titleRow { position: absolute; left: 0; top: 34px; width: 1248px; display: flex; justify-content: center; }
  #title { display: flex; align-items: center; gap: 16px; padding: 14px 28px; border-radius: 16px;
           background: rgba(11,13,18,0.9); border: 1px solid rgba(232,236,244,0.16); }
  #kicker { font-family: "Inter"; font-weight: 500; font-size: 16px; letter-spacing: 0.12em; color: #5B8CFF; }
  #titleText { font-family: "Space Grotesk"; font-weight: 700; font-size: 36px; letter-spacing: -0.03em; color: #E8ECF4; white-space: nowrap;
               max-width: 900px; overflow: hidden; }

  /* the split: card | VS column | card */
  #row { position: absolute; left: 0; top: 150px; width: 1248px; height: 440px; display: flex; justify-content: center; align-items: center; }
  .card { position: relative; width: 440px; height: 420px; box-sizing: border-box; border-radius: 28px;
          background: rgba(11,13,18,0.92); border: 2px solid color-mix(in srgb, var(--c) 70%, transparent);
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #cardA { --c: var(--a); }
  #cardB { --c: var(--b); }
  .glow { position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at 50% 36%, color-mix(in srgb, var(--c) 42%, transparent) 0%, transparent 62%); }
  .stripe { position: absolute; left: 0; bottom: 0; width: 100%; height: 8px; border-radius: 0 0 26px 26px; background: var(--c); }
  .slot { position: relative; width: 170px; height: 170px; color: var(--c); }
  .slot svg { display: block; width: 100%; height: 100%; }
  .mask { position: relative; overflow: hidden; padding: 0 6px; }
  .name { font-family: "Space Grotesk"; font-weight: 700; font-size: 64px; line-height: 1.12; letter-spacing: -0.03em;
          color: #E8ECF4; white-space: nowrap; max-width: 380px; overflow: hidden; text-align: center; }
  .tag { position: relative; font-family: "Inter"; font-weight: 500; font-size: 16px; letter-spacing: 0.12em; color: #E8ECF4;
         padding: 8px 16px; border-radius: 999px; background: color-mix(in srgb, var(--c) 30%, rgba(11,13,18,0.9));
         border: 1px solid color-mix(in srgb, var(--c) 80%, transparent); white-space: nowrap;
         max-width: 360px; overflow: hidden; text-overflow: ellipsis; }

  #mid { position: relative; width: 210px; height: 420px; display: flex; align-items: center; justify-content: center; }
  /* ring + sparks: one svg inside #vs so they travel with it; both start hidden */
  #sparks { position: absolute; left: -43px; top: -148px; width: 210px; height: 420px; overflow: visible; }
  .spark, #ring { visibility: hidden; opacity: 0; }
  #vs { position: relative; width: 124px; height: 124px; border-radius: 50%; background: #5B8CFF;
        box-shadow: 0 0 0 6px rgba(11,13,18,0.9), 0 0 40px rgba(91,140,255,0.6);
        display: flex; align-items: center; justify-content: center; }
  #vsText { font-family: "Space Grotesk"; font-weight: 700; font-size: 56px; letter-spacing: -0.03em; color: #E8ECF4; line-height: 1; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="shake">
    <div id="titleRow"><div id="title"><span id="kicker"></span><span id="titleText"></span></div></div>
    <div id="row">
      <div class="card" id="cardA">
        <div class="glow" id="glowA"></div>
        <div class="slot" id="slotA">
          <!-- placeholder logo: Nova (ring + core); paste any SVG logo here -->
          <svg id="logoA" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="12"/><circle cx="50" cy="50" r="15" fill="currentColor"/></svg>
        </div>
        <div class="mask"><div class="name" id="nameA"></div></div>
        <div class="tag" id="tagA"></div>
        <div class="stripe"></div>
      </div>
      <div id="mid">
        <div id="vs">
        <svg id="sparks" viewBox="0 0 210 420">
          <g stroke="#5B8CFF" stroke-width="6" stroke-linecap="round">
            <line class="spark" x1="105" y1="128" x2="105" y2="100"/>
            <line class="spark" x1="105" y1="292" x2="105" y2="320"/>
            <line class="spark" x1="66" y1="146" x2="50" y2="124"/>
            <line class="spark" x1="144" y1="146" x2="160" y2="124"/>
            <line class="spark" x1="66" y1="274" x2="50" y2="296"/>
            <line class="spark" x1="144" y1="274" x2="160" y2="296"/>
          </g>
          <circle id="ring" cx="105" cy="210" r="66" fill="none" stroke="#5B8CFF" stroke-width="4"/>
        </svg>
        <span id="vsText"></span>
        </div>
      </div>
      <div class="card" id="cardB">
        <div class="glow" id="glowB"></div>
        <div class="slot" id="slotB">
          <!-- placeholder logo: Apex (stacked peaks) -->
          <svg id="logoB" viewBox="0 0 100 100"><polygon points="50,8 94,88 6,88" fill="currentColor"/><polygon points="50,46 70,82 30,82" fill="#0B0D12" fill-opacity="0.55"/></svg>
        </div>
        <div class="mask"><div class="name" id="nameB"></div></div>
        <div class="tag" id="tagB"></div>
        <div class="stripe"></div>
      </div>
    </div>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
const DATA = {
  kicker: "HEAD TO HEAD",
  title: "Coding benchmark",
  vs: "VS",
  a: { name: "Nova", tag: "NOVA-4 PRO", color: "#4D6BFE" },
  b: { name: "Apex", tag: "APEX ULTRA 2", color: "#10A37F" },
};

// ---- fill the DOM from DATA
const $ = s => document.querySelector(s);
$("#stage").style.setProperty("--a", DATA.a.color);
$("#stage").style.setProperty("--b", DATA.b.color);
$("#kicker").textContent = DATA.kicker;
$("#titleText").textContent = DATA.title;
$("#vsText").textContent = DATA.vs;
$("#nameA").textContent = DATA.a.name;
$("#nameB").textContent = DATA.b.name;
$("#tagA").textContent = DATA.a.tag;
$("#tagB").textContent = DATA.b.tag;

// shrink a nowrap text until it fits its max-width (long names stay on the card)
function fit(el, minScale = 0.45) {
  const base = parseFloat(getComputedStyle(el).fontSize);
  for (let s = base; el.scrollWidth > el.clientWidth && s > base * minScale; s -= 1) el.style.fontSize = s + "px";
}

document.fonts.ready.then(() => {
  fit($("#nameA"));
  fit($("#nameB"));
  fit($("#titleText"));
  const tl = gsap.timeline({ paused: true });

  const shake = (at, amp) => tl.to("#shake", { keyframes: [
      { x: -amp, y: amp * 0.6, duration: 0.04 }, { x: amp * 0.8, y: -amp * 0.5, duration: 0.05 },
      { x: -amp * 0.45, y: amp * 0.3, duration: 0.05 }, { x: amp * 0.2, y: -amp * 0.1, duration: 0.06 },
      { x: 0, y: 0, duration: 0.08 } ], ease: "power2.out" }, at);

  // a logo slam: ghosted and big, swells (wind-up), drops onto the card, squashes and settles
  const slam = (slot, card, at) => {
    tl.fromTo(slot, { scale: 1.8, autoAlpha: 0 }, { scale: 1.95, autoAlpha: 0.35, duration: 0.14, ease: "power2.out" }, at)
      .to(slot, { scale: 1, autoAlpha: 1, duration: 0.16, ease: "power4.in" }, at + 0.14)
      .to(slot, { scaleY: 0.8, scaleX: 1.14, duration: 0.06, ease: "power2.out" }, at + 0.3)
      .to(slot, { scaleY: 1, scaleX: 1, duration: 0.36, ease: "back.out(3)" }, at + 0.36)
      // the card takes the hit: dips, and its colour stripe kicks
      .to(card, { scale: 0.975, duration: 0.06, ease: "power2.out" }, at + 0.3)
      .to(card, { scale: 1, duration: 0.4, ease: "back.out(3)" }, at + 0.36)
      .fromTo(card + " .stripe", { scaleY: 1 }, { scaleY: 2.6, duration: 0.06, ease: "power2.out", transformOrigin: "50% 100%" }, at + 0.3)
      .to(card + " .stripe", { scaleY: 1, duration: 0.4, ease: "power3.out" }, at + 0.36);
    shake(at + 0.3, 5);
    return at + 0.3;
  };

  // 1. cards sweep in from their sides
  tl.from("#cardA", { x: -70, autoAlpha: 0, scale: 0.94, duration: 0.5, ease: "expo.out" }, 0)
    .from("#cardB", { x: 70, autoAlpha: 0, scale: 0.94, duration: 0.5, ease: "expo.out" }, 0.06);

  // 2. logos slam, each name rises out of its mask after the hit
  const hitA = slam("#slotA", "#cardA", 0.2);
  const hitB = slam("#slotB", "#cardB", 0.58);
  tl.from("#nameA", { yPercent: 105, duration: 0.42, ease: "power4.out" }, hitA + 0.04)
    .from("#nameB", { yPercent: 105, duration: 0.42, ease: "power4.out" }, hitB + 0.04);

  // 3. VS punches into the gap: wind-up, slam, bigger shake, cards knocked outward, ring + sparks burst
  const hit = 1.22;
  tl.fromTo("#vs", { scale: 1.4, autoAlpha: 0, rotation: -6 }, { scale: 1.55, autoAlpha: 0.4, rotation: -9, duration: 0.14, ease: "power2.out" }, hit - 0.3)
    .to("#vs", { scale: 1, autoAlpha: 1, rotation: 0, duration: 0.16, ease: "power4.in" }, hit - 0.16)
    .to("#vs", { scaleX: 1.2, scaleY: 0.82, duration: 0.06, ease: "power2.out" }, hit)
    .to("#vs", { scaleX: 1, scaleY: 1, duration: 0.5, ease: "elastic.out(1.1, 0.4)" }, hit + 0.06)
    .to("#cardA", { x: -12, rotation: -1, duration: 0.12, ease: "power1.out" }, hit)
    .to("#cardB", { x: 12, rotation: 1, duration: 0.12, ease: "power1.out" }, hit)
    .to(["#cardA", "#cardB"], { x: 0, rotation: 0, duration: 0.6, ease: "elastic.out(1, 0.45)" }, hit + 0.12)
    .fromTo("#ring", { scale: 0.9, autoAlpha: 1, transformOrigin: "50% 50%" }, { scale: 1.5, autoAlpha: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, hit)
    .fromTo(".spark", { scale: 0.2, autoAlpha: 0, transformOrigin: "50% 50%" },
            { scale: 1, autoAlpha: 1, duration: 0.14, ease: "power3.out", stagger: 0.015 }, hit)
    .to(".spark", { autoAlpha: 0, duration: 0.3, ease: "power2.in", stagger: 0.015 }, hit + 0.18);
  shake(hit, 9);

  // 4. title plate drops in, tags pop
  tl.from("#title", { y: -26, autoAlpha: 0, scale: 0.9, duration: 0.5, ease: "back.out(2.2)" }, hit + 0.22)
    .from(["#tagA", "#tagB"], { scale: 0.4, autoAlpha: 0, duration: 0.42, ease: "back.out(3)", stagger: 0.08 }, hit + 0.3)
    // 5. still alive near the end: the VS throbs once and a second ring rolls out
    .to("#vs", { scale: 1.12, duration: 0.16, ease: "power2.out" }, hit + 0.95)
    .to("#vs", { scale: 1, duration: 0.42, ease: "back.out(3)" }, hit + 1.11)
    .fromTo("#ring", { scale: 0.95, autoAlpha: 0.8, transformOrigin: "50% 50%" }, { scale: 1.45, autoAlpha: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, hit + 1.0)
    .to({}, { duration: 0.3 }, hit + 1.53);

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
