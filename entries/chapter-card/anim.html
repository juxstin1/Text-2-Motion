<!doctype html>
<html>
<head>
<!-- pack: gallery-serif -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #1C2B24; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #1C2B24; }
  .label { font-family: "Space Grotesk"; font-weight: 500; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
  #numeral { position: absolute; left: 120px; top: 196px; font-family: "Instrument Serif"; font-size: 40px; line-height: 1;
             color: #E7B76A; }
  #kicker { position: absolute; left: 176px; top: 212px; color: rgba(234,240,230,0.55); }
  #rule { position: absolute; left: 120px; top: 262px; width: 1040px; height: 2px; overflow: visible; }
  #title { position: absolute; left: 110px; top: 280px; white-space: nowrap; margin: 0; font-family: "Instrument Serif"; font-weight: 400;
           font-size: 160px; line-height: 1.02; letter-spacing: -0.02em; color: #EAF0E6; }
  #sub { position: absolute; left: 120px; top: 474px; width: 560px; margin: 0; font-family: "Space Grotesk"; font-size: 22px;
         line-height: 1.45; color: rgba(234,240,230,0.7); }
  #page { position: absolute; right: 120px; top: 484px; color: rgba(234,240,230,0.45); }
</style>
</head>
<body>
<div id="stage">
  <div id="numeral">II</div>
  <div id="kicker" class="label">Chapter Two &middot; Late Summer</div>
  <svg id="rule" viewBox="0 0 1040 2"><path id="rulePath" d="M0 1 H1040" stroke="#E7B76A" stroke-width="1.5" fill="none"/></svg>
  <h1 id="title">The Quiet Orchard</h1>
  <p id="sub">In which the house is sold, and nobody will say why.</p>
  <div id="page" class="label">p. 47</div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/SplitText.min.js"></script>
<script src="../../vendor/DrawSVGPlugin.min.js"></script>
<script>
gsap.registerPlugin(SplitText, DrawSVGPlugin);
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  const title = SplitText.create("#title", { type: "words", mask: "words" });
  tl.from("#numeral", { autoAlpha: 0, y: 18, duration: 0.8, ease: "power3.out" })
    .from("#kicker", { autoAlpha: 0, x: -12, duration: 0.7, ease: "power3.out" }, "-=0.55")
    .fromTo("#rulePath", { drawSVG: "0%" }, { drawSVG: "100%", duration: 1.2, ease: "power3.inOut" }, 0.3)
    .from(title.words, { yPercent: 100, duration: 1.3, ease: "expo.out", stagger: 0.12 }, 0.95)
    .from("#sub", { autoAlpha: 0, y: 16, duration: 0.8, ease: "power2.out" }, "-=0.85")
    .from("#page", { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, "<0.1")
    .to({}, { duration: 0.4 });
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
