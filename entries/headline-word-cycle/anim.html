<!doctype html>
<html>
<head>
<!-- pack: tech-launch -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #0B0D12; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0B0D12;
           font-family: 'Inter', sans-serif; color: #E8ECF4; }
  #glow { position: absolute; left: 640px; top: -200px; width: 900px; height: 900px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(91,140,255,0.16), rgba(91,140,255,0)); }
  #eyebrow { position: absolute; left: 120px; top: 186px; font-size: 13px; font-weight: 500; letter-spacing: 0.12em;
             text-transform: uppercase; color: #5B8CFF; }
  #hmask { position: absolute; left: 112px; top: 218px; height: 124px; overflow: hidden; padding-right: 24px; }
  #line { font-family: 'Space Grotesk', sans-serif; font-size: 104px; font-weight: 700; letter-spacing: -0.03em;
          line-height: 124px; white-space: nowrap; }
  #slot { display: inline-block; vertical-align: top; height: 124px; overflow: hidden; }
  #words > div { height: 124px; }
  #words .alt { color: rgba(232,236,244,0.42); }
  #words .final { color: #5B8CFF; }
  #underline { position: absolute; top: 344px; height: 6px; background: #5B8CFF; transform-origin: 0 50%; }
  #sub { position: absolute; left: 120px; top: 382px; width: 560px; font-size: 22px; line-height: 1.5; color: rgba(232,236,244,0.62); }
  #ctas { position: absolute; left: 120px; top: 488px; display: flex; align-items: center; gap: 28px; }
  #cta { height: 52px; padding: 0 26px; border-radius: 12px; background: #5B8CFF; color: #0B0D12; font-size: 16px; font-weight: 600;
         display: flex; align-items: center; }
  #cmd { font-family: 'Space Grotesk'; font-size: 16px; color: rgba(232,236,244,0.55); }
  #cmd b { color: #E8ECF4; font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="eyebrow">Introducing Forge 3.0</div>
  <div id="hmask"><div id="line">Build <div id="slot"><div id="words">
    <div class="alt">smarter</div><div class="alt">bolder</div><div class="final">faster.</div>
  </div></div></div></div>
  <div id="underline"></div>
  <div id="sub">One command turns your repo into a production deploy, with previews for every branch.</div>
  <div id="ctas"><div id="cta">Start building</div><div id="cmd"><b>$</b> npx forge init</div></div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
document.fonts.ready.then(() => {
  // underline sits under the final word: measure it once fonts are in
  const fin = document.querySelector("#words .final");
  const slot = document.getElementById("slot");
  const range = document.createRange(); range.selectNodeContents(fin);
  const fw = range.getBoundingClientRect().width;
  const stageLeft = document.getElementById("stage").getBoundingClientRect().left;
  const ul = document.getElementById("underline");
  ul.style.left = (slot.getBoundingClientRect().left - stageLeft + 4) + "px";
  ul.style.width = (fw - 30) + "px";

  const tl = gsap.timeline({ paused: true });
  tl.from("#eyebrow", { y: 12, autoAlpha: 0, duration: 0.5, ease: "power3.out" }, 0.05)
    .from("#line", { yPercent: 105, duration: 0.9, ease: "power4.out" }, 0.12)
    .from("#sub", { y: 16, autoAlpha: 0, duration: 0.7, ease: "power3.out" }, 0.45)
    .from(["#cta", "#cmd"], { y: 16, autoAlpha: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 }, 0.6)
    // the cycle: stacked words slide up through the masked slot
    .to("#words", { yPercent: -100 / 3, duration: 0.55, ease: "power4.inOut" }, 1.05)
    .to("#words", { yPercent: -200 / 3, duration: 0.65, ease: "expo.inOut" }, 1.75)
    .from("#underline", { scaleX: 0, duration: 0.6, ease: "power3.out" }, "-=0.15")
    .to({}, { duration: 0.5 });

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
