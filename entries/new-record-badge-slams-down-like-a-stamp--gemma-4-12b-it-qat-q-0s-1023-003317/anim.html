<!doctype html>
<html lang="en">
<head>
<!-- pack: editorial -->
<meta charset="utf-8">
<meta name="description" content="New Record Badge Slam">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #F4EFE6; }
  #stage { 
    position: relative; 
    width: 1280px; 
    height: 720px; 
    overflow: hidden; 
    background: #F4EFE6; 
  }
  #bg {
    position: absolute;
    inset: 0;
    background: #F4EFE6;
  }
  #shake-container {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    will-change: transform;
  }
  #badge {
    position: relative;
    padding: 20px 40px;
    background: #B4442C;
    border: 6px solid #1B1A17;
    border-radius: 12px;
    display: inline-block;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  #badge-text {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 80px;
    color: #F4EFE6;
    text-transform: uppercase;
    margin: 0;
    line-height: 1;
    letter-spacing: -2px;
  }
  .stamp-texture {
    position: absolute;
    inset: 0;
    opacity: 0.1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" data-layer="back"></div>
  <div id="shake-container">
    <div id="badge" data-layer="back">
      <span id="badge-text"></span>
      <div class="stamp-texture"></div>
    </div>
  </div>
</div>

<script src="../../vendor/gsap.min.js"></script>
<script>
  const DATA = {
    text: "NEW RECORD",
    badgeColor: "#B4442C",
    textColor: "#F4EFE6",
    shakeIntensity: 12
  };

  document.fonts.ready.then(() => {
    // Populate DOM from DATA
    const badgeText = document.getElementById("badge-text");
    badgeText.innerText = DATA.text;
    
    // Build Timeline
    const tl = gsap.timeline({ paused: true });

    // 1. The Slam (Fast drop + rotation)
    tl.from("#badge", {
      y: -1000,
      rotation: -25,
      autoAlpha: 0,
      duration: 0.4,
      ease: "power4.out"
    })
    // 2. The Impact (Scale and slight rotation lock)
    .to("#badge", {
      scale: 1.15,
      rotation: -2,
      duration: 0.06,
      ease: "power2.out"
    }, "-=0.04")
    .to("#badge", {
      scale: 1,
      rotation: 0,
      duration: 0.12,
      ease: "back.out(2)"
    }, "-=0.06")
    // 3. The Screen Shake (Simultaneous with impact)
    .to("#shake-container", {
      x: DATA.shakeIntensity,
      y: -DATA.shakeIntensity,
      duration: 0.04,
      ease: "power2.out"
    }, "-=0.12")
    .to("#shake-container", {
      x: -DATA.shakeIntensity,
      y: DATA.shakeIntensity,
      duration: 0.04,
      ease: "power2.out"
    }, "-=0.08")
    .to("#shake-container", {
      x: 0,
      y: 0,
      duration: 0.04,
      ease: "power2.out"
    }, "-=0.08")
    // 4. Final Hold
    .to({}, { duration: 2 });

    window.TL = tl;
    if (location.search.includes("play")) tl.play();
  });
</script>
</body>
</html>
