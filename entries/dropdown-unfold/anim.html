<!doctype html>
<html>
<head>
<!-- pack: soft-saas -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #EEF1FB; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #EEF1FB;
           font-family: 'Manrope', sans-serif; font-weight: 500; color: #1A1F36; }
  #heading { position: absolute; left: 120px; top: 104px; font-family: 'Sora', sans-serif; font-size: 56px;
             font-weight: 700; letter-spacing: -0.025em; line-height: 1; }
  #sub { position: absolute; left: 122px; top: 178px; font-size: 16px; color: rgba(26,31,54,0.55); }
  /* static table, the context the menu opens over */
  #table { position: absolute; left: 120px; top: 248px; width: 1040px; }
  .trow { position: relative; height: 72px; border-top: 1px solid rgba(26,31,54,0.08); }
  .av { position: absolute; left: 0; top: 20px; width: 32px; height: 32px; border-radius: 10px; background: rgba(108,92,231,0.16); }
  .t1 { position: absolute; left: 52px; top: 22px; height: 10px; border-radius: 5px; background: rgba(26,31,54,0.16); }
  .t2 { position: absolute; left: 52px; top: 42px; height: 8px; border-radius: 4px; background: rgba(26,31,54,0.08); }
  .pill { position: absolute; right: 0; top: 24px; width: 72px; height: 24px; border-radius: 12px; background: rgba(26,31,54,0.06); }
  /* button + menu */
  #btn { position: absolute; right: 120px; top: 104px; height: 56px; padding: 0 20px 0 22px; box-sizing: border-box;
         display: flex; align-items: center; gap: 8px; border-radius: 14px; background: #1A1F36; color: #EEF1FB;
         font-size: 20px; font-weight: 600; box-shadow: 0 6px 16px rgba(26,31,54,0.18); }
  #btn .muted { color: rgba(238,241,251,0.6); font-weight: 500; }
  #chev { width: 18px; height: 18px; margin-left: 6px; }
  #chev path { fill: none; stroke: #EEF1FB; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #menu { position: absolute; right: 120px; top: 174px; width: 320px; padding: 10px; box-sizing: border-box;
          border-radius: 16px; background: #EEF1FB; transform-origin: 100% 0;
          box-shadow: 0 0 0 1px rgba(26,31,54,0.08), 0 24px 48px rgba(26,31,54,0.16), 0 4px 12px rgba(26,31,54,0.06); }
  .mlabel { padding: 8px 12px 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
            color: rgba(26,31,54,0.45); }
  .item { position: relative; height: 52px; padding: 0 14px; display: flex; align-items: center; font-size: 20px;
          border-radius: 10px; }
  .item.on { color: #6C5CE7; font-weight: 700; background: rgba(108,92,231,0.1); }
  .item .tick { position: absolute; right: 16px; top: 16px; width: 20px; height: 20px; }
  .tick path { fill: none; stroke: #6C5CE7; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .sep { height: 1px; margin: 6px 4px; background: rgba(26,31,54,0.08); }
</style>
</head>
<body>
<div id="stage">
  <div id="heading">Projects</div>
  <div id="sub">24 active &middot; updated 2 min ago</div>
  <div id="table">
    <div class="trow"><div class="av"></div><div class="t1" style="width:220px"></div><div class="t2" style="width:140px"></div><div class="pill"></div></div>
    <div class="trow"><div class="av"></div><div class="t1" style="width:180px"></div><div class="t2" style="width:110px"></div><div class="pill"></div></div>
    <div class="trow"><div class="av"></div><div class="t1" style="width:250px"></div><div class="t2" style="width:160px"></div><div class="pill"></div></div>
    <div class="trow"><div class="av"></div><div class="t1" style="width:200px"></div><div class="t2" style="width:120px"></div><div class="pill"></div></div>
    <div class="trow"><div class="av"></div><div class="t1" style="width:160px"></div><div class="t2" style="width:130px"></div><div class="pill"></div></div>
  </div>
  <div id="btn"><span class="muted">Sort by</span><span>Newest</span>
    <svg id="chev" viewBox="0 0 16 16"><path d="M4 6 L8 10 L12 6"/></svg></div>
  <div id="menu">
    <div class="mlabel item-in">Sort order</div>
    <div class="item on item-in">Newest first<svg class="tick" viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg></div>
    <div class="item item-in">Oldest first</div>
    <div class="item item-in">Name, A to Z</div>
    <div class="item item-in">Recently edited</div>
    <div class="sep item-in"></div>
    <div class="item item-in">Custom order&hellip;</div>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });

  // press feedback on the button, then the menu unfolds from its top-right corner
  tl.to("#btn", { scale: 0.95, duration: 0.12, ease: "power2.out" }, 0)
    .to("#btn", { scale: 1, duration: 0.45, ease: "back.out(3)" })
    .to("#chev", { rotation: 180, duration: 0.5, ease: "back.out(2)" }, 0.1)
    .from("#menu", { scaleY: 0.4, scaleX: 0.92, y: -10, autoAlpha: 0, duration: 0.55, ease: "power4.out" }, 0.14)
    .from(".item-in", { y: -8, autoAlpha: 0, duration: 0.42, ease: "power3.out", stagger: 0.045 }, "<0.08")
    .from(".tick", { scale: 0, rotation: -30, duration: 0.4, ease: "back.out(2.5)" }, "-=0.2")
    .to({}, { duration: 0.6 });

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
