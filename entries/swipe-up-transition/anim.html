<!doctype html>
<html>
<head>
<!-- pack: minimal-mono -->
<!-- format: vertical -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #F2F2F0; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; background: #F2F2F0;
           font-family: 'JetBrains Mono', monospace; color: #111111; }
  #bg { position: absolute; inset: 0; background: #F2F2F0; }
  /* the viewport masks the scenes, so a scene that has flown out is clipped, not "off-stage" */
  #view { position: absolute; inset: 0; overflow: hidden; }
  .full { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; }

  /* scene A: paper grid */
  #plateA { background-color: #F2F2F0;
            background-image: linear-gradient(rgba(17,17,17,0.06) 2px, transparent 2px),
                              linear-gradient(90deg, rgba(17,17,17,0.06) 2px, transparent 2px);
            background-size: 60px 60px; background-position: 0 20px; }
  .lab { font-weight: 500; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; }
  #labA { position: absolute; left: 0; right: 0; top: 318px; text-align: center; color: #FF3B00; }
  #headA { position: absolute; left: 0; right: 0; top: 362px; text-align: center; font-weight: 700; font-size: 150px;
           line-height: 1; letter-spacing: -0.04em; }
  #subA { position: absolute; left: 0; right: 0; top: 540px; text-align: center; font-size: 28px; color: rgba(17,17,17,0.65); }
  #doc { position: absolute; left: 150px; top: 616px; width: 420px; height: 230px; }
  #hint { position: absolute; left: 0; right: 0; top: 884px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #hint svg { width: 44px; height: 28px; }

  /* scene B: accent panel rises, the dark card drops onto it */
  #panelB { background: #FF3B00; }
  #cardB { position: absolute; left: 130px; top: 400px; width: 460px; height: 340px; box-sizing: border-box; padding-top: 44px;
           background: #111111; color: #F2F2F0; text-align: center; box-shadow: 14px 14px 0 rgba(17,17,17,0.25); }
  #labB { color: #FF3B00; }
  #headB { margin-top: 8px; font-weight: 700; font-size: 140px; line-height: 1; letter-spacing: -0.04em; }
  #barB { width: 280px; height: 12px; margin: 22px auto 0; background: #FF3B00; }
  #subB { position: absolute; left: 0; right: 0; top: 790px; text-align: center; font-weight: 700; font-size: 30px; color: #111111; }
  #fx { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="view">
    <div id="sceneA" class="full">
      <div id="plateA" class="full" data-layer="back"></div>
      <div id="labA" class="lab">Step 01</div>
      <div id="headA">Draft.</div>
      <div id="subA">rough, fast, ugly</div>
      <svg id="doc" viewBox="0 0 420 230">
        <rect x="3" y="3" width="414" height="224" fill="#F2F2F0" stroke="#111111" stroke-width="6"/>
        <g stroke="#111111" stroke-width="10" stroke-linecap="square" fill="none">
          <path d="M40 54 H300"/><path d="M40 94 H360"/><path d="M40 134 H230"/><path d="M40 174 H320"/>
        </g>
        <path d="M250 124 L300 146 M300 124 L250 146" stroke="#FF3B00" stroke-width="8"/>
        <path d="M200 166 C230 150 260 196 300 170 S350 160 370 182" fill="none" stroke="#FF3B00" stroke-width="6"/>
      </svg>
      <div id="hint">
        <svg id="chev" viewBox="0 0 44 28"><path d="M4 24 L22 6 L40 24" fill="none" stroke="#111111" stroke-width="6"/></svg>
        <div id="hintT" class="lab" style="font-size:22px">swipe up</div>
      </div>
    </div>
    <div id="panelB" class="full" data-layer="back"></div>
    <div id="subB">clean. live. done.</div>
    <div id="cardB">
      <div id="labB" class="lab">Step 02</div>
      <div id="headB">Ship.</div>
      <div id="barB"></div>
    </div>
    <!-- speed streaks and impact ticks: fixed shapes in one svg -->
    <svg id="fx" viewBox="0 0 720 1280">
      <g id="streaks" stroke="#111111" stroke-width="8" stroke-linecap="square" fill="none">
        <path d="M60 1240 V700"/><path d="M130 1260 V860"/><path d="M590 1250 V780"/><path d="M660 1230 V640"/>
      </g>
      <g id="ticks" stroke="#111111" stroke-width="8" stroke-linecap="square" fill="none">
        <path d="M80 722 L44 702"/><path d="M80 742 L36 742"/><path d="M640 722 L676 702"/><path d="M640 742 L684 742"/>
      </g>
    </svg>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/DrawSVGPlugin.min.js"></script>
<script src="../../vendor/SplitText.min.js"></script>
<script>
gsap.registerPlugin(DrawSVGPlugin, SplitText);
document.fonts.ready.then(() => {
  const charsB = new SplitText("#headB", { type: "chars" }).chars;
  gsap.set("#panelB", { y: 1290 });
  gsap.set("#cardB", { y: -780 });
  gsap.set(["#subB", "#labB"], { autoAlpha: 0 });
  gsap.set("#barB", { scaleX: 0 });
  gsap.set("#streaks path, #ticks path", { drawSVG: "0% 0%" });
  gsap.set(["#streaks", "#ticks"], { autoAlpha: 0 });
  const tl = gsap.timeline({ paused: true });

  // 1. HOOK: the swipe hint nudges up twice, the scene leans into it
  tl.to("#chev", { y: -16, duration: 0.12, ease: "power2.out" }, 0)
    .to("#chev", { y: 0, duration: 0.12, ease: "power2.in" }, 0.12)
    .to("#chev", { y: -20, duration: 0.1, ease: "power2.out" }, 0.24)
    .to("#hintT", { y: -6, duration: 0.1, ease: "power2.out" }, 0.26)
  // 2. anticipation: scene A dips and squashes against the floor
    .to("#sceneA", { y: 44, scaleY: 0.95, scaleX: 1.025, transformOrigin: "50% 100%", duration: 0.16, ease: "power2.out" }, 0.26)
  // 3. the swipe: A stretches along the motion and rockets out of the top
    .to("#sceneA", { y: -1460, duration: 0.36, ease: "power3.in" }, 0.42)
    .to("#sceneA", { scaleY: 1.38, scaleX: 0.9, duration: 0.3, ease: "power2.in" }, 0.42)
    .to("#doc", { y: 70, duration: 0.3, ease: "power2.in" }, 0.44)          // heavy bits lag behind
    .to("#hint", { y: 120, duration: 0.3, ease: "power2.in" }, 0.44)
  // speed streaks whip up through the frame
    .set("#streaks", { autoAlpha: 1 }, 0.56)
    .to("#streaks path", { drawSVG: "0% 100%", duration: 0.16, ease: "power2.out", stagger: 0.03 }, 0.56)
    .to("#streaks path", { drawSVG: "100% 100%", duration: 0.2, ease: "power2.in", stagger: 0.03 }, 0.72)
    .set("#streaks", { autoAlpha: 0 }, 0.99)
    .to("#streaks", { y: -420, duration: 0.4, ease: "power2.in" }, 0.56)
  // 4. B's accent panel rides up in the wake
    .to("#panelB", { y: 0, duration: 0.42, ease: "power3.out" }, 0.62);

  // 5. the card drops in from above, stretched by its fall, and lands with a hard squash
  const tD = 0.84, tI = tD + 0.24;
  tl.fromTo("#cardB", { scaleY: 1.18, scaleX: 0.9, transformOrigin: "50% 100%" },
                      { y: 0, scaleY: 1.1, scaleX: 0.94, duration: 0.24, ease: "power3.in" }, tD)
    .to("#cardB", { keyframes: [{ scaleY: 0.72, scaleX: 1.18, duration: 0.07, ease: "power2.out" },
                                { scaleY: 1.08, scaleX: 0.95, duration: 0.13, ease: "power2.out" },
                                { scaleY: 0.97, scaleX: 1.02, duration: 0.12, ease: "sine.inOut" },
                                { scaleY: 1, scaleX: 1, duration: 0.2, ease: "sine.out" }] }, tI)
    .to("#panelB", { keyframes: [{ y: 10, duration: 0.06, ease: "power2.out" },
                                 { y: 0, duration: 0.4, ease: "elastic.out(1, 0.4)" }] }, tI)
    .set("#ticks", { autoAlpha: 1 }, tI)
    .to("#ticks path", { drawSVG: "0% 100%", duration: 0.12, ease: "power2.out" }, tI)
    .to("#ticks path", { drawSVG: "100% 100%", duration: 0.2, ease: "power2.in" }, tI + 0.12)
    .set("#ticks", { autoAlpha: 0 }, tI + 0.33)
  // 6. follow-through: letters jostle after the hit, label and bar land, the subline rises
    .fromTo(charsB, { y: -18 }, { y: 0, duration: 0.5, ease: "elastic.out(1.1, 0.35)", stagger: 0.03 }, tI + 0.02)
    .fromTo("#labB", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, tI + 0.1)
    .to("#barB", { scaleX: 1, duration: 0.4, ease: "expo.out" }, tI + 0.16)
    .fromTo("#subB", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, tI + 0.22)
  // 7. stays alive: the bar punches once, the card settles with a last nod
    .to("#barB", { keyframes: [{ scaleX: 1.12, duration: 0.12, ease: "power2.out" },
                               { scaleX: 1, duration: 0.4, ease: "elastic.out(1, 0.4)" }] }, tI + 0.7)
    .to("#cardB", { keyframes: [{ y: -10, duration: 0.2, ease: "power2.out" },
                                { y: 0, duration: 0.24, ease: "power2.in" },
                                { scaleY: 0.96, scaleX: 1.03, duration: 0.06, ease: "power2.out" },
                                { scaleY: 1, scaleX: 1, duration: 0.26, ease: "sine.out" }] }, tI + 0.74)
    .to({}, { duration: 0.3 }); // final hold

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
