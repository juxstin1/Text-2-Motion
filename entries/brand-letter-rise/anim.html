<!doctype html>
<html>
<head>
<!-- pack: luxury -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #0E0C0A; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0E0C0A; color: #EDE3D1; }
  #frame { position: absolute; left: 40px; top: 40px; width: 1200px; height: 640px; box-sizing: border-box; border: 1px solid rgba(201,164,92,0.22); }
  #kicker { position: absolute; left: 0; width: 1280px; top: 232px; text-align: center; font: 500 12px/1 'Manrope'; letter-spacing: 0.32em; color: #C9A45C; }
  #brand { position: absolute; left: 0; width: 1280px; top: 268px; margin: 0; text-align: center; font: 400 112px/1.15 'DM Serif Display'; letter-spacing: 0em; }
  #rule { position: absolute; left: 600px; top: 432px; width: 80px; height: 1px; background: #C9A45C; }
  #tagline { position: absolute; left: 0; width: 1280px; top: 464px; margin: 0; text-align: center; font: 300 20px/1.4 'Manrope'; letter-spacing: 0.02em; color: rgba(237,227,209,0.72); }
  .corner { position: absolute; font: 500 12px/1 'Manrope'; letter-spacing: 0.32em; color: rgba(237,227,209,0.4); }
</style>
</head>
<body>
<div id="stage">
  <div id="frame"></div>
  <div class="corner" style="left:72px; top:72px">PARIS</div>
  <div class="corner" style="right:72px; top:72px">N° 07</div>
  <div id="kicker">EST. 1924</div>
  <h1 id="brand">Maison Aurelle</h1>
  <div id="rule"></div>
  <p id="tagline">Fine fragrance, composed by hand.</p>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/SplitText.min.js"></script>
<script>
gsap.registerPlugin(SplitText);
document.fonts.ready.then(() => {
  const split = SplitText.create("#brand", { type: "chars", mask: "chars" });
  const tl = gsap.timeline({ paused: true });
  tl.from("#kicker", { y: 10, autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 0)
    // each letter rises out of its own mask; long expo tail keeps it unhurried
    .from(split.chars, { yPercent: 110, duration: 1.1, ease: "expo.out", stagger: 0.055 }, 0.25)
    .from("#rule", { scaleX: 0, duration: 0.8, ease: "power3.inOut" }, 1.35)
    // tagline arrives last, soft and slow
    .from("#tagline", { y: 8, autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 1.75)
    .to({}, { duration: 0.4 }); // final hold
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
