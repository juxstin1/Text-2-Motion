<!doctype html>
<html>
<head>
<!-- pack: playful -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #FFE8D6; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #FFE8D6; color: #2B1B4A; }
  #tag { position: absolute; left: 0; width: 1280px; top: 150px; text-align: center; }
  #tag span { display: inline-block; padding: 10px 20px; border-radius: 999px; background: #2B1B4A; color: #FFE8D6; font: 700 14px/1 'Sora'; letter-spacing: 0.06em; }
  .line { position: absolute; left: 0; width: 1280px; margin: 0; text-align: center; font: 800 128px/1 'Syne'; letter-spacing: -0.03em; }
  #l1 { top: 220px; }
  #l2 { top: 352px; color: #FF4F7B; }
  #sub { position: absolute; left: 0; width: 1280px; top: 512px; margin: 0; text-align: center; font: 500 26px/1.3 'Sora'; color: rgba(43,27,74,0.72); }
</style>
</head>
<body>
<div id="stage">
  <div id="tag"><span>FRI · 6PM · ROOFTOP</span></div>
  <h1 class="line" id="l1">Pizza</h1>
  <h1 class="line" id="l2">Party!</h1>
  <p id="sub">Snacks out, phones down, music up.</p>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/SplitText.min.js"></script>
<script>
gsap.registerPlugin(SplitText);
document.fonts.ready.then(() => {
  const chars = [
    ...SplitText.create("#l1", { type: "chars" }).chars,
    ...SplitText.create("#l2", { type: "chars" }).chars,
  ];
  // fixed "shuffled" order and tilt per letter: deterministic, looks random
  const order = [7, 2, 9, 0, 5, 10, 3, 8, 1, 6, 4];
  const tilt  = [-7, 6, -5, 7, -6, 5, -7, 6, -5, 7, -6];
  const shuffled = order.filter(i => i < chars.length).map(i => chars[i]);

  const tl = gsap.timeline({ paused: true });
  tl.from("#tag", { y: -20, autoAlpha: 0, duration: 0.5, ease: "power3.out" }, 0)
    // each letter springs up from nothing with a little twist, then lands square
    .from(shuffled, {
      scale: 0, autoAlpha: 0, duration: 0.55, ease: "back.out(1.7)",
      rotation: i => tilt[i], transformOrigin: "50% 60%", stagger: 0.055,
    }, 0.15)
    .from("#sub", { y: 18, autoAlpha: 0, duration: 0.6, ease: "power3.out" }, 1.0)
    .to({}, { duration: 0.5 }); // final hold
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
