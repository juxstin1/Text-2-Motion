<!doctype html>
<html>
<head>
<!-- pack: luxury -->
<!-- format: vertical -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #0E0C0A; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; background: #0E0C0A; }
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, #1A1611 0%, #0E0C0A 62%); }
  /* soft halo behind the mark */
  #halo { position: absolute; left: 120px; top: 190px; width: 480px; height: 480px; border-radius: 50%;
          background: radial-gradient(circle, rgba(201,164,92,0.28) 0%, rgba(201,164,92,0) 66%); }
  #mark { position: absolute; left: 180px; top: 250px; width: 360px; height: 360px; overflow: visible; }

  #word { position: absolute; left: 0; top: 662px; width: 720px; display: flex; justify-content: center; }
  #wmask { display: flex; overflow: hidden; padding: 4px 8px 10px; }
  .ch { display: inline-block; font-family: "DM Serif Display"; font-size: 112px; line-height: 1; color: #EDE3D1; letter-spacing: 0.04em; }
  #label { position: absolute; left: 0; top: 822px; width: 720px; text-align: center;
           font-family: "Manrope"; font-weight: 500; font-size: 20px; letter-spacing: 0.32em; color: #C9A45C; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="halo" data-layer="back"></div>
  <svg id="mark" viewBox="0 0 300 300">
    <defs>
      <clipPath id="facets">
        <polygon points="154,40 250,146 154,146"/><polygon points="154,154 250,154 154,260"/>
        <polygon points="146,154 146,260 50,154"/><polygon points="146,146 50,146 146,40"/>
      </clipPath>
      <linearGradient id="glintG" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#EDE3D1" stop-opacity="0"/>
        <stop offset="0.5" stop-color="#EDE3D1" stop-opacity="1"/>
        <stop offset="1" stop-color="#EDE3D1" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <circle id="ring" cx="150" cy="150" r="138" fill="none" stroke="#C9A45C" stroke-width="2" transform="rotate(-90 150 150)"/>
    <g id="crest">
      <polygon class="pc" id="pTR" points="154,40 250,146 154,146" fill="#C9A45C"/>
      <polygon class="pc" id="pBR" points="154,154 250,154 154,260" fill="#C9A45C" fill-opacity="0.62"/>
      <polygon class="pc" id="pBL" points="146,154 146,260 50,154" fill="#C9A45C" fill-opacity="0.82"/>
      <polygon class="pc" id="pTL" points="146,146 50,146 146,40" fill="#C9A45C" fill-opacity="0.45"/>
      <g clip-path="url(#facets)">
        <polygon id="glint" points="116,-20 186,-20 70,320 0,320" fill="url(#glintG)"/>
      </g>
    </g>
    <path id="twinkle" d="M262 30 L267 53 L290 58 L267 63 L262 86 L257 63 L234 58 L257 53 Z" fill="#EDE3D1"/>
  </svg>
  <div id="word"><div id="wmask"></div></div>
  <div id="label">MAISON &middot; EST. 1998</div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/DrawSVGPlugin.min.js"></script>
<script>
gsap.registerPlugin(DrawSVGPlugin);
const NAME = "Nova";
const wm = document.getElementById("wmask");
[...NAME].forEach(c => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; wm.appendChild(s); });

document.fonts.ready.then(() => {
  // seamless loop: the first and last frames are both the empty stage (pieces scattered and invisible)
  const tl = gsap.timeline({ paused: true });
  const chars = gsap.utils.toArray(".ch");
  // each facet's scattered start: pushed out along its own diagonal, turned and shrunk
  const scatter = {
    "#pTR": { x: 130, y: -120, rotation: 80, scale: 0.5 },
    "#pBR": { x: 140, y: 120, rotation: -70, scale: 0.5 },
    "#pBL": { x: -130, y: 130, rotation: 90, scale: 0.5 },
    "#pTL": { x: -140, y: -110, rotation: -85, scale: 0.5 },
  };
  Object.entries(scatter).forEach(([id, v]) => gsap.set(id, { ...v, autoAlpha: 0, transformOrigin: "50% 50%" }));
  gsap.set("#crest", { svgOrigin: "150 150" });
  gsap.set("#ring", { drawSVG: "0% 0%" });
  gsap.set("#glint", { x: -140, autoAlpha: 0 });
  gsap.set("#twinkle", { scale: 0, autoAlpha: 0, transformOrigin: "50% 50%" });
  gsap.set(chars, { yPercent: 115 });
  gsap.set("#label", { autoAlpha: 0, y: 12 });
  gsap.set("#halo", { autoAlpha: 0, scale: 0.8 });

  // 1. facets fly in on arcs (x and y on different eases curve the path), spinning down into place
  const lock = 0.72;
  Object.keys(scatter).forEach((id, k) => {
    const at = 0.02 + k * 0.05, d = lock - at;
    tl.to(id, { autoAlpha: 1, duration: 0.16, ease: "power2.out" }, at)
      .to(id, { x: 0, duration: d, ease: "power3.in" }, at)
      .to(id, { y: 0, duration: d, ease: "power2.inOut" }, at)
      .to(id, { rotation: 0, scale: 1, duration: d, ease: "power3.in" }, at);
  });
  // they lock together: a little compression, then the crest rings out
  tl.to("#crest", { scale: 0.93, duration: 0.06, ease: "power2.out" }, lock)
    .to("#crest", { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.45)" }, lock + 0.06)
    .to("#halo", { autoAlpha: 1, scale: 1, duration: 0.6, ease: "power2.out" }, lock)
    .to("#ring", { drawSVG: "0% 100%", duration: 0.7, ease: "power2.inOut" }, lock - 0.12);

  // 2. wordmark rises out of its mask letter by letter, label settles under it
  tl.to(chars, { yPercent: 0, duration: 0.6, ease: "power4.out", stagger: 0.06 }, lock + 0.1)
    .to("#label", { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, lock + 0.36);

  // 3. breathe: slow inhale and exhale of the whole crest and the halo
  const b0 = 1.4;
  tl.to("#crest", { scale: 1.045, duration: 0.6, ease: "sine.inOut" }, b0)
    .to("#crest", { scale: 1, duration: 0.6, ease: "sine.inOut" }, b0 + 0.6)
    .to("#halo", { scale: 1.12, autoAlpha: 0.7, duration: 0.6, ease: "sine.inOut" }, b0)
    .to("#halo", { scale: 1, autoAlpha: 1, duration: 0.6, ease: "sine.inOut" }, b0 + 0.6)
    // 4. glint sweeps across the facets at the top of the breath, a star twinkles where it exits
    .to("#glint", { autoAlpha: 1, duration: 0.1, ease: "power1.out" }, b0 + 0.2)
    .to("#glint", { x: 220, duration: 0.7, ease: "power2.inOut" }, b0 + 0.2)
    .to("#glint", { autoAlpha: 0, duration: 0.1, ease: "power1.in" }, b0 + 0.8)
    .to("#twinkle", { scale: 1, autoAlpha: 1, rotation: 45, duration: 0.22, ease: "back.out(2.5)" }, b0 + 0.68)
    .to("#twinkle", { scale: 0, autoAlpha: 0, rotation: 90, duration: 0.3, ease: "power2.in" }, b0 + 0.9);

  // 5. exhale out: a last small inhale, then the facets drift back to their scatter and the type sinks
  const x0 = 2.7;
  tl.to("#crest", { scale: 1.05, duration: 0.2, ease: "power2.out" }, x0)
    .to(chars, { yPercent: 115, duration: 0.42, ease: "power3.in", stagger: 0.04 }, x0)
    .to("#label", { autoAlpha: 0, y: 12, duration: 0.36, ease: "power2.in" }, x0)
    .to("#ring", { drawSVG: "100% 100%", duration: 0.55, ease: "power2.inOut" }, x0 + 0.05)
    .to("#halo", { autoAlpha: 0, scale: 0.8, duration: 0.6, ease: "power2.in" }, x0 + 0.1);
  Object.entries(scatter).forEach(([id, v], k) => {
    tl.to(id, { ...v, duration: 0.6, ease: "power2.in" }, x0 + 0.18 + k * 0.03)
      .to(id, { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, x0 + 0.48 + k * 0.03);
  });
  tl.to("#crest", { scale: 1, duration: 0.5, ease: "power2.inOut" }, x0 + 0.2)
    .to({}, { duration: 0.02 }, x0 + 0.9);

  window.TL = tl;
  if (location.search.includes("play")) tl.repeat(-1).play();
});
</script>
</body>
</html>
