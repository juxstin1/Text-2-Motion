<!doctype html>
<html>
<head>
<!-- pack: soft-saas -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #EEF1FB; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #EEF1FB;
           font-family: 'Manrope', sans-serif; color: #1A1F36; }
  #bg { position: absolute; inset: 0; background:
        radial-gradient(900px 520px at 50% 42%, rgba(108,92,231,0.16), rgba(108,92,231,0) 70%), #EEF1FB; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

  /* the whole table sits on its own panel so it reads over any footage */
  #panel { display: grid; grid-template-columns: minmax(340px, auto) auto auto; column-gap: 12px;
           padding: 28px 32px 30px; border-radius: 28px; background: #FFFFFF;
           box-shadow: 0 30px 70px rgba(26,31,54,0.28), 0 0 0 1px rgba(108,92,231,0.12); }
  #title { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin: 0 0 18px 4px;
           font-family: 'Sora', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.025em; }
  #title i { width: 12px; height: 12px; border-radius: 4px; background: #6C5CE7; flex: none; }
  .row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; }
  .row + .row { margin-top: 8px; }
  .cell { position: relative; display: flex; align-items: center; justify-content: center;
          min-width: 200px; height: 70px; border-radius: 16px; }
  .cell.feat { justify-content: flex-start; min-width: 0; padding: 0 20px; background: #F3F4FC;
               font-weight: 600; font-size: 22px; }
  .hl { position: absolute; inset: 0; border-radius: 16px; background: var(--brand); opacity: 0.14; }

  /* header row: logo slot, name and a running tally per brand */
  .head .cell { height: auto; flex-direction: column; justify-content: flex-start; gap: 8px; padding: 14px 18px 12px; max-width: 240px; }
  .head .feat { background: none; padding: 0 20px; align-self: end; align-items: flex-start; font-family: 'Sora'; font-weight: 600;
                font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: #6C5CE7; }
  .slot { width: 64px; height: 64px; position: relative; z-index: 1; }
  .slot svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .bname { position: relative; z-index: 1; font-family: 'Sora'; font-weight: 700; font-size: 22px;
           letter-spacing: -0.025em; text-align: center; line-height: 1.15; }
  .tally { position: relative; z-index: 1; padding: 3px 12px; border-radius: 99px; background: #1A1F36; color: #FFFFFF;
           font-family: 'Sora'; font-weight: 600; font-size: 13px; letter-spacing: 0.04em; }
  .win { position: absolute; z-index: 2; top: -14px; left: 50%; margin-left: -48px; width: 96px; padding: 5px 0;
         border-radius: 99px; background: var(--brand); color: #FFFFFF; text-align: center; overflow: hidden;
         font-family: 'Sora'; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
         box-shadow: 0 8px 20px rgba(26,31,54,0.25); }
  .sheen { position: absolute; top: -10px; left: -40px; width: 24px; height: 50px; background: rgba(255,255,255,0.55);
           transform: rotate(20deg); }

  /* check / cross marks */
  .mark { position: relative; z-index: 1; width: 40px; height: 40px; }
  .mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="wrap">
    <div id="panel">
      <div id="title"><i></i><span id="titleText"></span></div>
      <div class="row head" id="head">
        <div class="cell feat" id="headLabel"></div>
        <div class="cell" id="colA"><div class="hl" data-layer="back"></div>
          <div class="slot" id="slotA"><svg id="logoA" viewBox="0 0 100 100"></svg></div>
          <div class="bname" id="nameA"></div><div class="tally" id="tallyA"></div></div>
        <div class="cell" id="colB"><div class="hl" data-layer="back"></div>
          <div class="slot" id="slotB"><svg id="logoB" viewBox="0 0 100 100"></svg></div>
          <div class="bname" id="nameB"></div><div class="tally" id="tallyB"></div></div>
      </div>
      <!-- feature rows are created from DATA.rows -->
    </div>
  </div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/DrawSVGPlugin.min.js"></script>
<script>
const DATA = {
  title: "Feature check",
  label: "Feature",
  winLabel: "Winner",
  a: { name: "Nova", color: "#4D6BFE",
       logo: '<circle cx="50" cy="50" r="46" fill="currentColor"/><circle cx="50" cy="50" r="22" fill="none" stroke="#fff" stroke-width="9"/><circle cx="72" cy="28" r="7" fill="#fff"/>' },
  b: { name: "Apex", color: "#10A37F",
       logo: '<path d="M50 6 L95 90 H5 Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M50 44 L68 78 H32 Z" fill="#fff"/>' },
  rows: [
    { feature: "Long context",     a: true,  b: true  },
    { feature: "Image input",      a: true,  b: false },
    { feature: "Offline mode",     a: false, b: true  },
    { feature: "Free tier",        a: true,  b: false },
  ],
};

gsap.registerPlugin(DrawSVGPlugin);
document.fonts.ready.then(() => {
  // ---------- fill the DOM from DATA
  const $ = id => document.getElementById(id);
  const stage = $("stage");
  $("titleText").textContent = DATA.title;
  $("headLabel").textContent = DATA.label;
  ["a", "b"].forEach(k => {
    const K = k.toUpperCase(), d = DATA[k];
    $("col" + K).style.setProperty("--brand", d.color);
    $("logo" + K).innerHTML = d.logo;
    $("logo" + K).style.color = d.color;
    $("name" + K).textContent = d.name;
    $("tally" + K).textContent = "0/" + DATA.rows.length;
  });
  const CHECK = '<circle cx="20" cy="20" r="20" fill="currentColor"/><path class="tick" d="M11 20.5 L17.5 27 L29.5 13.5" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>';
  const CROSS = '<circle cx="20" cy="20" r="19" fill="#EEF1FB" stroke="rgba(26,31,54,0.18)" stroke-width="2"/><path class="tick" d="M14 14 L26 26 M26 14 L14 26" fill="none" stroke="rgba(26,31,54,0.55)" stroke-width="4" stroke-linecap="round"/>';
  const rows = DATA.rows.map((r, i) => {
    const row = document.createElement("div");
    row.className = "row"; row.id = "row" + i;
    row.innerHTML = `<div class="cell feat"></div>` + ["a", "b"].map(k =>
      `<div class="cell" style="--brand:${DATA[k].color}"><div class="hl" data-layer="back"></div>
         <div class="mark"><svg viewBox="0 0 40 40" style="color:${DATA[k].color}">${r[k] ? CHECK : CROSS}</svg></div></div>`).join("");
    row.querySelector(".feat").textContent = r.feature;
    $("panel").appendChild(row);
    return row;
  });
  const score = { a: DATA.rows.filter(r => r.a).length, b: DATA.rows.filter(r => r.b).length };
  const winKey = score.a === score.b ? null : (score.a > score.b ? "a" : "b");
  if (winKey) {
    const pill = document.createElement("div");
    pill.className = "win"; pill.id = "winPill";
    pill.innerHTML = '<span></span><div class="sheen"></div>';
    pill.querySelector("span").textContent = DATA.winLabel;
    $("col" + winKey.toUpperCase()).appendChild(pill);
  }

  // ---------- initial state
  gsap.set(".hl", { scaleY: 0, transformOrigin: "50% 0%" });
  gsap.set(".row:not(.head)", { transformPerspective: 900, transformOrigin: "50% 0%" });
  gsap.set(".mark", { scale: 0, rotation: -25 });

  const tl = gsap.timeline({ paused: true });

  // 1. panel rises in with a soft overshoot, title follows
  tl.from("#panel", { y: 60, scale: 0.9, autoAlpha: 0, duration: 0.7, ease: "back.out(1.5)" }, 0)
    .from("#title", { x: -24, autoAlpha: 0, duration: 0.5, ease: "power3.out" }, 0.15)
  // 2. logos pop with a spin, names and tallies trail
    .from(["#slotA", "#slotB"], { scale: 0, rotation: -40, duration: 0.6, ease: "back.out(2.6)", stagger: 0.1 }, 0.25)
    .from(["#nameA", "#nameB", "#tallyA", "#tallyB", "#headLabel"], { y: 14, autoAlpha: 0, duration: 0.45, ease: "power3.out", stagger: 0.05 }, 0.38);

  // 3. rows flip down one by one; each brand's mark pops as its row lands
  const ROW0 = 0.62, GAP = 0.2, tally = { a: 0, b: 0 };
  rows.forEach((row, i) => {
    const t = ROW0 + i * GAP;
    tl.from(row, { rotationX: -95, autoAlpha: 0, y: -10, duration: 0.55, ease: "back.out(1.6)" }, t);
    const marks = row.querySelectorAll(".mark");
    ["a", "b"].forEach((k, j) => {
      const tm = t + 0.24 + j * 0.08, m = marks[j];
      tl.to(m, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, tm)
        .from(m.querySelector(".tick"), { drawSVG: 0, duration: 0.3, ease: "power2.out" }, tm + 0.08);
      if (DATA.rows[i][k]) {
        // tally ticks up with a squash on the chip
        const from = tally[k], to = ++tally[k], el = $("tally" + k.toUpperCase());
        const c = { v: from };
        tl.to(c, { v: to, duration: 0.15, ease: "power2.out",
                   onUpdate: () => { el.textContent = Math.round(c.v) + "/" + DATA.rows.length; } }, tm + 0.1)
          .fromTo(el, { scaleX: 1.25, scaleY: 0.8 }, { scaleX: 1, scaleY: 1, duration: 0.4, ease: "elastic.out(1, 0.45)", immediateRender: false }, tm + 0.1);
      }
    });
  });

  // 4. the winning column lights up top to bottom, its logo bumps and the pill lands
  const tW = ROW0 + rows.length * GAP + 0.45;
  if (winKey) {
    const j = winKey === "a" ? 1 : 2;
    const cells = [$("col" + winKey.toUpperCase()), ...rows.map(r => r.children[j])];
    tl.to(cells.map(c => c.querySelector(".hl")), { scaleY: 1, duration: 0.45, ease: "power3.out", stagger: 0.06 }, tW)
      .to("#slot" + winKey.toUpperCase(), { keyframes: [
          { scale: 0.86, duration: 0.12, ease: "power2.in" },
          { scale: 1.18, rotation: 8, duration: 0.22, ease: "power3.out" },
          { scale: 1, rotation: 0, duration: 0.5, ease: "elastic.out(1, 0.4)" }] }, tW)
      .from("#winPill", { y: -22, scale: 0.4, autoAlpha: 0, duration: 0.55, ease: "back.out(2.8)" }, tW + 0.22)
      .to("#winPill .sheen", { x: 160, duration: 0.7, ease: "power2.inOut" }, tW + 0.6)
      .to(cells.slice(1).map(c => c.querySelector(".mark")), { scale: 1.12, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.05 }, tW + 0.15);
  }
  tl.to({}, { duration: 0.3 }); // final hold

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
