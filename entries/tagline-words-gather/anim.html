<!doctype html>
<html>
<head>
<!-- pack: luxury -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #0E0C0A; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0E0C0A;
           font-family: 'Manrope', sans-serif; font-weight: 300; color: #EDE3D1; }
  .label { font-family: 'Manrope'; font-size: 12px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; }
  #brand { position: absolute; left: 0; top: 196px; width: 1280px; text-align: center; color: #C9A45C; }
  #mark { position: absolute; left: 634px; top: 236px; width: 12px; height: 12px; transform: rotate(45deg);
          border: 1px solid rgba(201,164,92,0.7); box-sizing: border-box; }
  #tagline { position: absolute; left: 0; top: 300px; width: 1280px; text-align: center; font-family: 'DM Serif Display', serif;
             font-size: 64px; font-weight: 400; letter-spacing: 0em; line-height: 1.1; }
  #tagline .gold { color: #C9A45C; }
  #collection { position: absolute; left: 0; right: 0; margin: 0 auto; top: 452px; width: fit-content; text-align: center; color: rgba(237,227,209,0.6); }
  .rule { position: absolute; top: 458px; width: 150px; height: 1px; background: rgba(201,164,92,0.6); }
  #rl { left: 290px; transform-origin: 100% 50%; }
  #rr { left: 840px; transform-origin: 0 50%; }
  #foot { position: absolute; left: 0; top: 600px; width: 1280px; text-align: center; font-size: 15px; letter-spacing: 0.02em;
          color: rgba(237,227,209,0.4); }
</style>
</head>
<body>
<div id="stage">
  <div id="brand" class="label">Maison Veran</div>
  <div id="mark"></div>
  <div id="tagline">Made slowly. Worn for a <span class="gold">lifetime.</span></div>
  <div class="rule" id="rl"></div><div class="rule" id="rr"></div>
  <div id="collection" class="label">The Autumn Collection &middot; MMXXVI</div>
  <div id="foot">Paris &nbsp;&middot;&nbsp; Milan &nbsp;&middot;&nbsp; Kyoto</div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/SplitText.min.js"></script>
<script>
gsap.registerPlugin(SplitText);
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  const words = SplitText.create("#tagline", { type: "words" }).words;
  const mid = (words.length - 1) / 2;

  tl.from("#brand", { y: 10, autoAlpha: 0, duration: 0.9, ease: "power2.out" }, 0)
    .from("#mark", { scale: 0, autoAlpha: 0, duration: 0.8, ease: "power3.out" }, 0.15)
    // words start far apart (outer words furthest) and drift together as they appear
    .from(words, {
      x: i => (i - mid) * 54,
      autoAlpha: 0,
      duration: 2.3,
      ease: "power2.out",
      stagger: { each: 0.07, from: "center" }
    }, 0.3)
    .from(["#rl", "#rr"], { scaleX: 0, duration: 1.0, ease: "power3.inOut" }, 1.5)
    .from("#collection", { autoAlpha: 0, y: 6, duration: 0.9, ease: "power2.out" }, 1.7)
    .from("#foot", { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 2.1)
    .to({}, { duration: 0.5 });

  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
