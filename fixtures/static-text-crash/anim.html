<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<!-- fixture: a moving block lands on static text (DEFECT); a box flies in through the edge (note only) -->
<style>body{margin:0;background:#111}#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#111}
#still{position:absolute;left:600px;top:560px;color:#fff;font:40px Inter}
#mover{position:absolute;left:300px;top:560px;width:120px;height:60px;background:#5B8CFF}
#fly{position:absolute;left:-300px;top:100px;width:200px;height:80px;background:#E8FF3A}</style></head>
<body><div id="stage"><div id="still">Static headline</div><div id="mover"></div><div id="fly"></div></div>
<script src="../../vendor/gsap.min.js"></script>
<script>
const tl = gsap.timeline({paused:true});
tl.to("#mover",{x:330,duration:0.6,ease:"power2.out"},0)
  .to("#fly",{x:700,duration:0.8,ease:"expo.out"},0)
  .to({}, {duration:0.4});
window.TL = tl;
</script></body></html>
