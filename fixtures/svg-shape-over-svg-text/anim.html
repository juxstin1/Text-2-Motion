<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<!-- fixture: free-standing text inside an svg must still be checked against the svg's shapes -->
<style>body{margin:0;background:#111}#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#111}</style></head>
<body><div id="stage">
 <svg id="art" width="1280" height="720" style="position:absolute;left:0;top:0">
   <circle id="dot" cx="100" cy="300" r="40" fill="#E8FF3A"/>
   <text id="svgHead" x="60" y="310" fill="#fff" font-family="Inter" font-size="40">SVG headline</text></svg>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script>
const tl = gsap.timeline({paused:true});
tl.to("#dot",{x:80,duration:0.5,ease:"power2.out"},0)
  .from("#svgHead",{autoAlpha:0,duration:0.4,ease:"power2.out"},0)
  .to({}, {duration:0.6});
window.TL = tl;
</script></body></html>
