<!doctype html>
<html>
<head>
<!-- pack: tech-launch -->
<!-- README banner: rendered by tools/make_readme_media.py (1280x400, not a bank entry) -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  body { margin: 0; background: #0B0D12; }
  #stage { position: relative; width: 1280px; height: 400px; overflow: hidden; background: #0B0D12; }
  #glow { position: absolute; left: 760px; top: -120px; width: 560px; height: 560px; border-radius: 50%;
          background: radial-gradient(circle, rgba(91,140,255,0.16), rgba(91,140,255,0) 65%); }
  #prompt { position: absolute; left: 88px; top: 92px; font: 400 22px/1 'JetBrains Mono'; color: rgba(232,236,244,0.55);
            letter-spacing: 0; white-space: nowrap; }
  #prompt .gt { color: #5B8CFF; margin-right: 12px; }
  #cursor { display: inline-block; width: 11px; height: 24px; margin-left: 4px; background: #5B8CFF; vertical-align: -4px; }
  #title { position: absolute; left: 82px; top: 150px; font: 700 104px/1 'Space Grotesk'; color: #E8ECF4;
           letter-spacing: -0.04em; white-space: nowrap; }
  #title .accent { color: #5B8CFF; }
  #sub { position: absolute; left: 90px; top: 284px; font: 500 15px/1 'Inter'; color: rgba(232,236,244,0.6);
         letter-spacing: 0.22em; text-transform: uppercase; }
  #ground { position: absolute; left: 900px; top: 318px; width: 260px; height: 2px; background: rgba(232,236,244,0.18); }
  #shadow { position: absolute; left: 990px; top: 312px; width: 80px; height: 12px; border-radius: 50%; background: rgba(0,0,0,0.55); }
  #ball { position: absolute; left: 990px; top: 238px; width: 80px; height: 80px; border-radius: 50%;
          background: radial-gradient(circle at 34% 30%, #9DB8FF, #5B8CFF 55%, #3D66D6); }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="prompt"><span class="gt">&gt;</span><span id="typed">ball drops in and squashes on landing</span><span id="cursor"></span></div>
  <div id="title">Text-2-<span class="accent">Motion</span></div>
  <div id="sub">teaching small models to animate</div>
  <div id="ground"></div>
  <div id="shadow"></div>
  <div id="ball"></div>
</div>
<script src="../../vendor/gsap.min.js"></script>
<script src="../../vendor/SplitText.min.js"></script>
<script>
gsap.registerPlugin(SplitText);
document.fonts.ready.then(() => {
  const chars = SplitText.create("#typed", { type: "chars" }).chars;
  const title = SplitText.create("#title", { type: "chars", mask: "chars" }).chars;
  const tl = gsap.timeline({ paused: true });
  gsap.set(chars, { autoAlpha: 0 });
  // the cursor sits after the full (hidden) line; pull it back to the right edge of the last typed char
  // (measured positions, since SplitText makes no elements for spaces)
  const typed = document.getElementById("typed").getBoundingClientRect();
  const rest = i => (i === 0 ? typed.left : chars[i - 1].getBoundingClientRect().right) - typed.right;
  gsap.set("#cursor", { x: rest(0) });

  // 1. the prompt types itself, cursor stepping with each character
  tl.to(chars, { autoAlpha: 1, duration: 0.01, stagger: 0.026, ease: "steps(1)" }, 0.1);
  chars.forEach((c, i) => tl.set("#cursor", { x: rest(i + 1) }, 0.1 + i * 0.026));
  tl

  // 2. the prompt becomes motion: ball drops, squashes, bounces twice, settles
    .fromTo("#ball", { y: -330 }, { y: 0, duration: 0.42, ease: "power2.in" }, 0.9)
    .fromTo("#ball", { scaleX: 0.86, scaleY: 1.18 }, { scaleX: 1, scaleY: 1, duration: 0.42, ease: "power2.in", transformOrigin: "50% 100%" }, 0.9)
    .fromTo("#shadow", { scale: 0.3, autoAlpha: 0.2 }, { scale: 1, autoAlpha: 1, duration: 0.42, ease: "power2.in" }, 0.9)
    .to("#ball", { scaleX: 1.38, scaleY: 0.62, duration: 0.07, ease: "power2.out", transformOrigin: "50% 100%" }, 1.32)
    .to("#ball", { y: -120, scaleX: 0.92, scaleY: 1.1, duration: 0.3, ease: "power2.out" }, 1.39)
    .to("#shadow", { scale: 0.55, duration: 0.3, ease: "power2.out" }, 1.39)
    .to("#ball", { y: 0, scaleX: 1, scaleY: 1, duration: 0.26, ease: "power2.in" }, 1.69)
    .to("#shadow", { scale: 1, duration: 0.26, ease: "power2.in" }, 1.69)
    .to("#ball", { scaleX: 1.2, scaleY: 0.82, duration: 0.06, ease: "power2.out" }, 1.95)
    .to("#ball", { y: -34, scaleX: 0.97, scaleY: 1.04, duration: 0.16, ease: "power2.out" }, 2.01)
    .to("#ball", { y: 0, scaleX: 1, scaleY: 1, duration: 0.15, ease: "power2.in" }, 2.17)
    .to("#ball", { scaleX: 1.07, scaleY: 0.94, duration: 0.05, ease: "power1.out" }, 2.32)
    .to("#ball", { scaleX: 1, scaleY: 1, duration: 0.3, ease: "elastic.out(1, 0.5)" }, 2.37)

  // 3. the title lands with the first impact
    .from(title, { yPercent: 110, duration: 0.6, ease: "expo.out", stagger: 0.025 }, 1.3)
    .from("#sub", { y: 10, autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 1.75)
    .to("#cursor", { autoAlpha: 0, duration: 0.01, ease: "steps(1)", repeat: 5, yoyo: true, repeatDelay: 0.24 }, 1.3)

  // 4. hold, then clear back to the empty first frame so the GIF loops cleanly
    .to(["#prompt", "#title", "#sub", "#ball", "#shadow"], { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, 4.0);
  window.TL = tl;
  if (location.search.includes("play")) tl.play();
});
</script>
</body>
</html>
